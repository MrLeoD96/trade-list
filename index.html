<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Musical Theater Archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Marked.js for parsing Markdown Preamble -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg: #090a0f;
            --bg-raised: #0f1118;
            --surface: rgba(19, 21, 30, 0.78);
            --surface-solid: #141720;
            --surface-hover: #191c26;
            --border: rgba(255, 255, 255, 0.085);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #f4f5f7;
            --text-soft: #c5c9d2;
            --text-muted: #858b9a;
            --text-dim: #626978;
            --accent: #8b7cff;
            --accent-bright: #a99fff;
            --accent-soft: rgba(139, 124, 255, 0.14);
            --highlight: #f4c95d;
            --highlight-text: #17140a;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
            --radius: 18px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.55;
            background:
                radial-gradient(circle at 50% -10%, rgba(139, 124, 255, 0.13), transparent 35rem),
                radial-gradient(circle at 100% 35%, rgba(92, 105, 255, 0.055), transparent 28rem),
                var(--bg);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
            z-index: 999;
        }

        button, input { font: inherit; }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 28px 20px 22px;
            background: rgba(9, 10, 15, 0.72);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(22px) saturate(150%);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
        }

        .header-inner {
            max-width: 1120px;
            margin: 0 auto;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        h1#siteTitle {
            margin: 0;
            color: #fff;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(24px, 3vw, 32px);
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.035em;
            text-align: center;
        }

        #lastUpdated {
            min-height: 22px;
            margin: 0 0 18px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        #lastUpdated .date {
            display: inline-flex;
            align-items: center;
            margin-left: 4px;
            padding: 3px 8px;
            color: var(--accent-bright);
            background: var(--accent-soft);
            border: 1px solid rgba(139, 124, 255, 0.16);
            border-radius: 999px;
            font-weight: 600;
        }

        .search-wrapper {
            position: relative;
            max-width: 760px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 18px;
            width: 19px;
            height: 19px;
            color: var(--text-muted);
            transform: translateY(-50%);
            pointer-events: none;
            transition: color .2s ease;
        }

        #searchInput {
            display: block;
            width: 100%;
            height: 54px;
            padding: 0 88px 0 50px;
            color: var(--text);
            background: rgba(20, 23, 32, 0.88);
            border: 1px solid var(--border-strong);
            border-radius: 15px;
            outline: none;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255,255,255,.025);
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        #searchInput::placeholder { color: #737988; }

        #searchInput:focus {
            background: rgba(23, 26, 37, .96);
            border-color: rgba(139, 124, 255, .6);
            box-shadow: 0 0 0 4px rgba(139, 124, 255, .11), 0 14px 40px rgba(0,0,0,.25);
        }

        .search-wrapper:focus-within .search-icon { color: var(--accent-bright); }

        .search-hint {
            position: absolute;
            top: 50%;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .key {
            min-width: 26px;
            padding: 3px 6px;
            color: var(--text-muted);
            background: rgba(255,255,255,.045);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.2;
            text-align: center;
        }

        #clearSearch {
            position: absolute;
            top: 50%;
            right: 12px;
            display: none;
            width: 30px;
            height: 30px;
            padding: 0;
            color: var(--text-muted);
            background: transparent;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transform: translateY(-50%);
        }

        #clearSearch:hover {
            color: var(--text);
            background: rgba(255,255,255,.07);
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 760px;
            margin: 10px auto 0;
        }

        #statusText {
            margin: 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 34px 20px 80px;
        }

        /* Preamble */
        #preamble-container {
            display: none;
            position: relative;
            margin: 0 auto 30px;
            padding: 25px 28px;
            color: var(--text-soft);
            background: linear-gradient(135deg, rgba(22, 24, 34, .92), rgba(14, 16, 23, .82));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(0,0,0,.14);
            overflow: hidden;
        }

        #preamble-container::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent-bright), transparent);
        }

        #preamble-container > *:first-child { margin-top: 0; }
        #preamble-container > *:last-child { margin-bottom: 0; }

        #preamble-container h1,
        #preamble-container h2,
        #preamble-container h3 {
            color: var(--text);
            font-family: "Space Grotesk", sans-serif;
            letter-spacing: -.02em;
        }

        #preamble-container h1:first-child { display: none; }
        #preamble-container h2 { font-size: 20px; }
        #preamble-container a { color: var(--accent-bright); }
        #preamble-container code {
            padding: 2px 5px;
            color: var(--text);
            background: rgba(255,255,255,.06);
            border-radius: 5px;
        }

        #preamble-container blockquote {
            margin-left: 0;
            padding-left: 16px;
            color: var(--text-muted);
            border-left: 2px solid var(--border-strong);
        }

        /* Archive */
        #archiveContainer {
            transition: opacity .16s ease, transform .16s ease;
        }

        #archiveContainer.is-filtering {
            opacity: .38;
            transform: translateY(3px);
        }

        .card {
            margin-bottom: 12px;
            background: linear-gradient(145deg, rgba(21, 24, 33, .94), rgba(16, 18, 25, .94));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 25px rgba(0,0,0,.10);
            overflow: hidden;
            transition: border-color .22s ease, transform .22s var(--ease), box-shadow .22s ease, opacity .22s ease;
        }

        .card:hover {
            border-color: rgba(255,255,255,.15);
            box-shadow: 0 13px 35px rgba(0,0,0,.18);
            transform: translateY(-1px);
        }

        .card.expanded {
            border-color: rgba(139,124,255,.27);
            box-shadow: 0 16px 45px rgba(0,0,0,.22);
        }

        .card-header {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 19px 20px;
            color: inherit;
            text-align: left;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        .card-header:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -3px;
            border-radius: var(--radius);
        }

        .card-info {
            min-width: 0;
            flex: 1;
            padding-right: 18px;
        }

        .card-title {
            margin: 0 0 7px;
            color: #fff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -.015em;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px 14px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .meta-icon {
            width: 14px;
            color: var(--text-dim);
            flex: 0 0 auto;
        }

        .expand-icon {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            color: var(--text-muted);
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: transform .32s var(--ease), background .22s ease, color .22s ease, border-color .22s ease;
        }

        .card.expanded .expand-icon {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
            transform: rotate(180deg);
        }

        /* True height animation without display:none */
        .card-body {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            border-top: 1px solid transparent;
            transition: grid-template-rows .38s var(--ease), opacity .22s ease, border-color .22s ease;
        }

        .card-body-inner {
            min-height: 0;
            overflow: hidden;
        }

        .card.expanded .card-body {
            grid-template-rows: 1fr;
            opacity: 1;
            border-top-color: var(--border);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px 24px;
            padding: 21px 20px 23px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .detail-label {
            margin-bottom: 5px;
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .detail-value {
            color: var(--text-soft);
            font-size: 13px;
            word-break: break-word;
        }

        .full-width {
            grid-column: 1 / -1;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
        }

        /* Search Highlighting */
        .highlight {
            padding: 1px 3px;
            color: var(--highlight-text);
            background: var(--highlight);
            border-radius: 4px;
            font-weight: 700;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .no-results {
            display: none;
            padding: 80px 20px;
            color: var(--text-muted);
            text-align: center;
        }

        .no-results-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            color: var(--text-dim);
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .no-results strong {
            display: block;
            margin-bottom: 5px;
            color: var(--text-soft);
            font-size: 15px;
        }

        .no-results span { font-size: 13px; }

        /* Loading skeleton */
        .skeleton {
            height: 88px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background:
                linear-gradient(90deg, rgba(255,255,255,.025) 25%, rgba(255,255,255,.06) 50%, rgba(255,255,255,.025) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.25s infinite linear;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        @media (max-width: 700px) {
            .header { padding: 22px 14px 17px; }
            .container { padding: 24px 14px 60px; }
            #preamble-container { padding: 21px; }
            .details-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 520px) {
            .header { position: relative; }
            .search-hint { display: none; }
            #searchInput { padding-right: 48px; }
            .card-header { padding: 17px 15px; }
            .card-meta { gap: 5px 11px; }
            .details-grid { grid-template-columns: 1fr; gap: 17px; padding: 18px 15px 20px; }
            .full-width { grid-column: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <div class="title-row">
                <h1 id="siteTitle">Musical Theater Archive</h1>
            </div>
            <div id="lastUpdated"></div>

            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg>

                <input
                    type="search"
                    id="searchInput"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Search shows, masters, venues, cast members..."
                    aria-label="Search archive"
                >

                <div class="search-hint" aria-hidden="true">
                    <span class="key">/</span>
                </div>

                <button id="clearSearch" type="button" aria-label="Clear search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6l12 12M18 6 6 18"></path>
                    </svg>
                </button>
            </div>

            <div class="status-row">
                <div id="statusText">Loading archive...</div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="preamble-container"></section>

        <div id="archiveContainer" aria-live="polite">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <div id="noResults" class="no-results">
            <div class="no-results-icon">
                <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <path d="m16 16 5 5M8 10.5h5"></path>
                </svg>
            </div>
            <strong>No matching records</strong>
            <span>Try a different title, master, venue, cast member, or keyword.</span>
        </div>
    </main>

    <script>
        let allData = [];
        let currentQuery = '';
        let searchTimer = null;

        // --- Helper Functions ---

        function escapeHtml(text) {
            if (text === null || text === undefined || text === '') return "-";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Search highlighting is intentionally preserved as span wrapping.
        function highlightText(text, query) {
            let safeText = escapeHtml(text);
            if (!query) return safeText;

            let safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let regex = new RegExp(`(${safeQuery})`, 'gi');
            return safeText.replace(regex, '<span class="highlight">$1</span>');
        }

        function formatDate(dateStr, precision, seqNum) {
            if (!dateStr) return "-";

            let parts = dateStr.split('/');
            if (parts.length !== 3) return dateStr;

            let dt = new Date(parts[2], parts[1] - 1, parts[0]);
            let seq = seqNum ? ` (${seqNum})` : "";

            if (precision === 'day') {
                return dt.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric'
                }) + seq;
            }

            if (precision === 'month') {
                return dt.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long'
                }) + seq;
            }

            if (precision === 'year') return parts[2] + seq;
            return dateStr + seq;
        }

        function icon(name) {
            const icons = {
                calendar: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
                theater: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9l8-5 8 5v11"/><path d="M8 20v-6h8v6"/></svg>',
                microphone: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>',
                film: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m8 5 2 14M14 5l2 14M3 10h18M3 14h18"/></svg>'
            };
            return icons[name] || '';
        }

        // --- Rendering ---

        function renderCards(query) {
            currentQuery = query;
            const normalizedQuery = query.trim().toLowerCase();
            let visibleCount = 0;
            let html = '';

            allData.forEach((row, index) => {
                const searchPool = [
                    row.title,
                    row.venue_production,
                    row.master,
                    row.performance_type,
                    row.format_type,
                    row.quality_resolution,
                    row.cast,
                    row.notes
                ].filter(Boolean).join(' ').toLowerCase();

                if (normalizedQuery && !searchPool.includes(normalizedQuery)) return;

                visibleCount++;

                const formattedDate = formatDate(
                    row.date,
                    row.date_precision,
                    row.master_sequence_num
                );

                html += `
                    <article class="card" data-index="${index}">
                        <button class="card-header" type="button" aria-expanded="false">
                            <div class="card-info">
                                <div class="card-title">${highlightText(row.title || "-", query)}</div>
                                <div class="card-meta">
                                    <span class="meta-item">${icon('calendar')}${highlightText(formattedDate, query)}</span>
                                    <span class="meta-item">${icon('theater')}${highlightText(row.venue_production || "-", query)}</span>
                                    <span class="meta-item">${icon('microphone')}${highlightText(row.master || "-", query)}</span>
                                    <span class="meta-item">${icon('film')}${highlightText(row.performance_type || "-", query)}</span>
                                </div>
                            </div>
                            <span class="expand-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m6 9 6 6 6-6"></path>
                                </svg>
                            </span>
                        </button>

                        <div class="card-body">
                            <div class="card-body-inner">
                                <div class="details-grid">
                                    <div class="detail-item">
                                        <span class="detail-label">Format</span>
                                        <span class="detail-value">${highlightText(row.format_type || "-", query)}</span>
                                    </div>

                                    <div class="detail-item">
                                        <span class="detail-label">Resolution</span>
                                        <span class="detail-value">${highlightText(row.quality_resolution || "-", query)}</span>
                                    </div>

                                    <div class="detail-item">
                                        <span class="detail-label">File Size</span>
                                        <span class="detail-value">${highlightText(row.file_size_original_text || "-", query)}</span>
                                    </div>

                                    <div class="detail-item full-width">
                                        <span class="detail-label">Cast</span>
                                        <span class="detail-value">${highlightText(row.cast || "-", query)}</span>
                                    </div>

                                    <div class="detail-item full-width">
                                        <span class="detail-label">Notes</span>
                                        <span class="detail-value">${highlightText(row.notes || "-", query)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            });

            const archive = document.getElementById('archiveContainer');
            archive.classList.add('is-filtering');

            // Let the fade-out render before replacing the list.
            requestAnimationFrame(() => {
                archive.innerHTML = html;
                archive.classList.remove('is-filtering');

                document.getElementById('noResults').style.display =
                    visibleCount === 0 ? 'block' : 'none';

                const statusEl = document.getElementById('statusText');
                if (normalizedQuery) {
                    statusEl.textContent =
                        `Showing ${visibleCount.toLocaleString()} matching record${visibleCount === 1 ? '' : 's'}.`;
                } else {
                    statusEl.textContent =
                        `Showing ${visibleCount.toLocaleString()} total records.`;
                }
            });
        }

        function toggleCard(cardEl) {
            const expanded = cardEl.classList.toggle('expanded');
            const button = cardEl.querySelector('.card-header');
            button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        }

        function updateClearButton() {
            const input = document.getElementById('searchInput');
            document.getElementById('clearSearch').style.display =
                input.value ? 'grid' : 'none';
        }

        // Event delegation means newly-rendered cards need no inline JS handlers.
        document.getElementById('archiveContainer').addEventListener('click', function (event) {
            const header = event.target.closest('.card-header');
            if (!header) return;
            toggleCard(header.closest('.card'));
        });

        // Debounced search: avoids rebuilding the entire archive on every keystroke.
        document.getElementById('searchInput').addEventListener('input', function (event) {
            updateClearButton();
            clearTimeout(searchTimer);

            const query = event.target.value;
            searchTimer = setTimeout(() => renderCards(query), 150);
        });

        document.getElementById('clearSearch').addEventListener('click', function () {
            const input = document.getElementById('searchInput');
            input.value = '';
            updateClearButton();
            renderCards('');
            input.focus();
        });

        // "/" focuses search; Escape clears it.
        document.addEventListener('keydown', function (event) {
            const input = document.getElementById('searchInput');

            if (event.key === '/' && document.activeElement !== input &&
                !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                event.preventDefault();
                input.focus();
            }

            if (event.key === 'Escape' && document.activeElement === input && input.value) {
                input.value = '';
                updateClearButton();
                renderCards('');
            }
        });

        // --- Initialization ---

        // 1. Fetch the Last Updated Date from GitHub API
        async function fetchLastUpdated() {
            try {
                // Extract username and repo name from the GitHub Pages URL.
                const hostParts = window.location.hostname.split('.');
                const owner = hostParts[0];
                const repo = window.location.pathname.split('/')[1];

                if (!owner || !repo) return;

                const apiUrl =
                    `https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1`;

                const response = await fetch(apiUrl);
                if (!response.ok) return;

                const commits = await response.json();

                if (commits.length > 0) {
                    const dateStr = commits[0].commit.committer.date;
                    const formattedDate = new Date(dateStr).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    document.getElementById('lastUpdated').innerHTML =
                        `Last updated <span class="date">${escapeHtml(formattedDate)}</span>`;
                }
            } catch (e) {
                console.log("Could not fetch last updated date.", e);
            }
        }

        fetchLastUpdated();

        // 2. Load the Preamble (README.md)
        fetch('README.md')
            .then(response => {
                if (!response.ok) return null;
                return response.text();
            })
            .then(text => {
                if (!text) return;

                // Parse markdown to HTML using the existing Marked.js CDN.
                let htmlContent = marked.parse(text);

                // Extract the first H1 title to use as the site title.
                let titleMatch = htmlContent.match(/<h1[^>]*>(.*?)<\/h1>/i);

                if (titleMatch && titleMatch[1]) {
                    // Decode the already-parsed heading into plain text.
                    const temp = document.createElement('div');
                    temp.innerHTML = titleMatch[1];
                    document.getElementById('siteTitle').innerText = temp.textContent;

                    // Remove that first H1 from the preamble box.
                    htmlContent = htmlContent.replace(titleMatch[0], '');
                }

                document.getElementById('preamble-container').innerHTML = htmlContent;
                document.getElementById('preamble-container').style.display = 'block';
            })
            .catch(() => {
                console.log("No README.md found. Skipping preamble.");
            });

        // 3. Load the Archive Data
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                allData = Array.isArray(data) ? data : [];
                renderCards('');
            })
            .catch(error => {
                console.error('Error loading data.json:', error);
                document.getElementById('statusText').textContent =
                    "Could not load archive data.";
                document.getElementById('archiveContainer').innerHTML = '';
                document.getElementById('noResults').innerHTML = `
                    <div class="no-results-icon">!</div>
                    <strong>Failed to load data</strong>
                    <span>Make sure data.json exists and is accessible from this page.</span>
                `;
                document.getElementById('noResults').style.display = 'block';
            });
    </script>
</body>
</html>
