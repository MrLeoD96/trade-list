<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Theater Archive</title>
    <!-- Modern Typography: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown Preamble -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* Sleek Dark Cyber-Obsidian Theme */
            --bg-color: #090a0f;
            --bg-surface: #12131a;
            --card-bg: rgba(22, 24, 34, 0.75);
            --card-hover: rgba(30, 33, 48, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            /* Accents */
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --accent-light: #818cf8;
            --badge-bg: rgba(99, 102, 241, 0.12);
            --badge-border: rgba(99, 102, 241, 0.25);
            
            --highlight-bg: #f59e0b;
            --highlight-text: #000000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphic Sticky Header */
        .header {
            background: rgba(9, 10, 15, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 28px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        h1#siteTitle {
            margin: 0 0 6px 0;
            color: #ffffff;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #lastUpdated {
            margin: 0 0 20px 0;
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        #lastUpdated .date {
            color: var(--accent-light);
            font-weight: 600;
        }

        /* Premium Search Input */
        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        #searchInput {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 15px;
            font-family: inherit;
            background-color: rgba(18, 19, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        #searchInput::placeholder {
            color: var(--text-dim);
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(22, 24, 34, 0.95);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 8px 20px rgba(0,0,0,0.3);
        }

        #searchInput:focus + .search-icon {
            color: var(--accent-light);
        }

        #statusText {
            margin-top: 10px;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }

        /* Preamble Styling */
        #preamble-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 28px;
            line-height: 1.6;
            font-size: 14px;
            backdrop-filter: blur(8px);
        }

        #preamble-container h1, #preamble-container h2, #preamble-container h3 {
            color: var(--text-main);
            margin-top: 0;
            font-weight: 700;
        }

        #preamble-container h1:first-child {
            display: none;
        }

        #preamble-container a {
            color: var(--accent-light);
            text-decoration: none;
        }

        #preamble-container a:hover {
            text-decoration: underline;
        }

        #preamble-container ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        /* Card Component */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            user-select: none;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        /* Custom Tag Pills for Meta */
        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .meta-pill svg {
            width: 13px;
            height: 13px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .meta-pill.highlight-pill {
            background: var(--badge-bg);
            border-color: var(--badge-border);
            color: var(--accent-light);
        }

        .expand-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.25s ease;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card:hover .expand-icon-wrapper {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .card.expanded .expand-icon-wrapper {
            transform: rotate(180deg);
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Smooth CSS Grid Expand Mechanism */
        .card-body-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card.expanded .card-body-wrapper {
            grid-template-rows: 1fr;
        }

        .card-body-content {
            overflow: hidden;
        }

        .card-body {
            padding: 16px 20px 20px 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.15);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .detail-value {
            color: var(--text-main);
            font-size: 13.5px;
            word-break: break-word;
            line-height: 1.5;
        }

        .full-width {
            grid-column: 1 / -1;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Highlight Matches */
        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 16px;
            font-weight: 500;
        }

        /* Skeleton Loading Components */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 37%, rgba(255, 255, 255, 0.03) 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
            border-radius: 6px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }

        .skeleton-card {
            height: 90px;
            margin-bottom: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            .header {
                padding: 20px 16px 16px;
            }
            .card-header {
                padding: 14px 16px;
            }
            .card-body {
                padding: 14px 16px;
            }
            .card-title {
                font-size: 16px;
            }
            .meta-pill {
                font-size: 11.5px;
                padding: 3px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <h1 id="siteTitle">Musical Theater Archive</h1>
            <div id="lastUpdated">Checking for updates...</div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search shows, masters, venues, cast members..." autocomplete="off">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <div id="statusText">Initialising database...</div>
        </div>
    </div>

    <div class="container">
        <!-- Preamble injected here -->
        <div id="preamble-container" style="display: none;"></div>
        
        <!-- Skeleton UI during initial load -->
        <div id="skeletonLoader">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <div id="archiveContainer"></div>
        <div id="noResults" class="no-results" style="display: none;">No matching records found.</div>
    </div>

    <!-- Inline SVG Icons Blueprint -->
    <svg style="display: none;">
        <defs>
            <g id="icon-calendar">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2"></line>
                <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2"></line>
                <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"></line>
            </g>
            <g id="icon-venue">
                <path d="M3 21h18M3 7v14M21 7v14M6 11h12M6 15h12M12 3L2 7h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="icon-mic">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g id="icon-film">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="7" y1="2" x2="7" y2="22" stroke="currentColor" stroke-width="2"/>
                <line x1="17" y1="2" x2="17" y2="22" stroke="currentColor" stroke-width="2"/>
                <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
            </g>
            <g id="icon-chevron">
                <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </defs>
    </svg>

    <script>
        let allData = [];
        let currentQuery = '';

        // --- Helper Functions ---

        function escapeHtml(text) {
            if (!text) return "-";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function highlightText(text, query) {
            let safeText = escapeHtml(text);
            if (!query) return safeText;
            
            let safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let regex = new RegExp(`(${safeQuery})`, 'gi');
            return safeText.replace(regex, '<span class="highlight">$1</span>');
        }

        function formatDate(dateStr, precision, seqNum) {
            if (!dateStr) return "-";
            let parts = dateStr.split('/');
            if (parts.length !== 3) return dateStr;

            let dt = new Date(parts[2], parts[1] - 1, parts[0]);
            let seq = seqNum ? ` (${seqNum})` : "";
            
            if (precision === 'day') return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) + seq;
            if (precision === 'month') return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short' }) + seq;
            if (precision === 'year') return parts[2] + seq;
            return dateStr + seq;
        }

        // Debounce mechanism to prevent search lagging on massive arrays
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Helper to construct pill elements safely
        function renderPill(iconId, value, query, extraClass = '') {
            if (!value || value === "-") return '';
            return `
                <span class="meta-pill ${extraClass}">
                    <svg><use href="#${iconId}"></use></svg>
                    ${highlightText(value, query)}
                </span>
            `;
        }

        // --- Core Rendering ---

        function renderCards(query) {
            currentQuery = query;
            let visibleCount = 0;
            let html = '';

            allData.forEach((row, index) => {
                let searchPool = [
                    row.title, row.venue_production, row.master, 
                    row.performance_type, row.format_type, row.quality_resolution, 
                    row.cast, row.notes
                ].filter(Boolean).join(' ').toLowerCase();

                if (query && !searchPool.includes(query.toLowerCase())) {
                    return;
                }
                visibleCount++;

                let formattedDate = formatDate(row.date, row.date_precision, row.master_sequence_num);

                html += `
                <div class="card" id="card-${index}" onclick="toggleCard(this)">
                    <div class="card-header">
                        <div class="card-info">
                            <div class="card-title">${highlightText(row.title || "Untitled Show", query)}</div>
                            <div class="card-meta">
                                ${renderPill('icon-calendar', formattedDate, query)}
                                ${renderPill('icon-venue', row.venue_production, query)}
                                ${renderPill('icon-mic', row.master, query, 'highlight-pill')}
                                ${renderPill('icon-film', row.performance_type, query)}
                            </div>
                        </div>
                        <div class="expand-icon-wrapper">
                            <svg width="16" height="16"><use href="#icon-chevron"></use></svg>
                        </div>
                    </div>
                    <div class="card-body-wrapper">
                        <div class="card-body-content">
                            <div class="card-body" onclick="event.stopPropagation()">
                                <div class="details-grid">
                                    <div class="detail-item">
                                        <span class="detail-label">Format</span>
                                        <span class="detail-value">${highlightText(row.format_type || "-", query)}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Resolution</span>
                                        <span class="detail-value">${highlightText(row.quality_resolution || "-", query)}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">File Size</span>
                                        <span class="detail-value">${highlightText(row.file_size_original_text || "-", query)}</span>
                                    </div>
                                    <div class="detail-item full-width">
                                        <span class="detail-label">Cast</span>
                                        <span class="detail-value">${highlightText(row.cast || "No cast information recorded.", query)}</span>
                                    </div>
                                    <div class="detail-item full-width">
                                        <span class="detail-label">Notes</span>
                                        <span class="detail-value">${highlightText(row.notes || "None", query)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            // Hide skeleton, inject rendered cards
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('archiveContainer').innerHTML = html;
            
            let statusEl = document.getElementById('statusText');
            if (query) {
                statusEl.innerText = `Showing ${visibleCount} matching record(s).`;
            } else {
                statusEl.innerText = `Showing ${visibleCount} total records.`;
            }

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function toggleCard(cardEl) {
            cardEl.classList.toggle('expanded');
        }

        // --- Event Listeners & Async Data Fetching ---

        // Debounced Instant Search (150ms delay)
        const handleSearch = debounce(function(e) {
            renderCards(e.target.value.trim());
        }, 150);

        document.getElementById('searchInput').addEventListener('input', handleSearch);

        // 1. Fetch Last Updated Date from GitHub API
        async function fetchLastUpdated() {
            try {
                const hostParts = window.location.hostname.split('.');
                const owner = hostParts[0];
                const repo = window.location.pathname.split('/')[1];
                
                if (!owner || !repo) {
                    document.getElementById('lastUpdated').innerText = 'Local Sandbox Mode';
                    return; 
                }

                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error();
                
                const commits = await response.json();
                if (commits.length > 0) {
                    const dateStr = commits[0].commit.committer.date;
                    const formattedDate = new Date(dateStr).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });
                    document.getElementById('lastUpdated').innerHTML = `Updated <span class="date">${formattedDate}</span>`;
                }
            } catch (e) {
                document.getElementById('lastUpdated').style.display = 'none';
            }
        }
        fetchLastUpdated();

        // 2. Load Preamble (README.md)
        fetch('README.md')
            .then(response => {
                if (!response.ok) return null;
                return response.text();
            })
            .then(text => {
                if (text) {
                    let htmlContent = marked.parse(text);
                    
                    let titleMatch = htmlContent.match(/<h1[^>]*>(.*?)<\/h1>/i);
                    if (titleMatch && titleMatch[1]) {
                        document.getElementById('siteTitle').innerText = titleMatch[1];
                        htmlContent = htmlContent.replace(titleMatch[0], '');
                    }
                    
                    const preambleEl = document.getElementById('preamble-container');
                    preambleEl.innerHTML = htmlContent;
                    preambleEl.style.display = 'block';
                }
            })
            .catch(() => console.log("README.md skipping."));

        // 3. Load Archive Data
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load database.');
                return response.json();
            })
            .then(data => {
                allData = data;
                renderCards('');
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('skeletonLoader').style.display = 'none';
                document.getElementById('statusText').innerText = "Database connection error.";
                document.getElementById('noResults').innerText = "Unable to load data.json archive.";
                document.getElementById('noResults').style.display = 'block';
            });
    </script>
</body>
</html>
