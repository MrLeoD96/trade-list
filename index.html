<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>LeoD's Trading List :)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Pinned to the v12 major line (was an unpinned "latest" tag) so an
     unannounced breaking change upstream can't silently break the
     preamble renderer. For full integrity pinning, jsdelivr publishes an
     SRI hash per exact version - add an integrity="sha384-..." attribute
     once you've picked one, from https://www.jsdelivr.com/package/npm/marked -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="app.js"></script>
<style>
:root {
    --bg: #111418;
    --paper: #161a20;
    --paper2: #1b2128;
    --paper3: #252b34;
    --line: #2c333d;
    --text: #e2e8e0;
    --soft: #b0b9b3;
    --muted: #7a8a82;
    --dim: #5a6660;

    /* Green is now strictly an accent */
    --accent: #4ade80;
    --accent2: #22c55e;
    --accent-soft: rgba(74, 222, 128, 0.12);

    /* Secondary colors for Markdown and status warnings */
    --purple: #a78bfa;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;

    --sans: 'Inter', system-ui, sans-serif;
    --mono-font: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }

.site-nav {
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky; top: 0; z-index: 60;
}
.nav-inner {
    max-width: 1080px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
}
.nav-brand {
    padding: 18px 0;
    font: 700 19px var(--sans); color: var(--accent);
    text-decoration: none; letter-spacing: -0.01em; white-space: nowrap;
    transition: color 0.15s ease;
}
.nav-brand:hover { color: var(--accent2); }
.nav-links { display: flex; align-items: stretch; gap: 2px; flex-wrap: wrap; }
.nav-link {
    display: flex; align-items: center; position: relative;
    height: 60px; padding: 0 14px;
    font: 500 14px var(--sans); color: var(--soft);
    text-decoration: none; transition: color 0.15s ease;
}
.nav-link:hover { color: var(--text); }
.nav-link.active { color: var(--text); }
.nav-link.active::after {
    content: ''; position: absolute; left: 14px; right: 14px; bottom: 0;
    height: 2px; background: var(--accent);
}
.nav-link-cta {
    align-self: center; height: 38px; margin: 0 0 0 4px;
    border: 1px solid var(--line); border-radius: 6px;
}
.nav-link-cta:hover { border-color: var(--paper3); background: var(--paper2); }
.nav-link-cta.active { border-color: var(--accent); color: var(--accent); }
.nav-link-cta.active::after { display: none; }

.page { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
.page-section { display: none; }
.page-section.active { display: block; }
.page-markdown {
    max-width: 760px; margin: 0 auto; padding: 44px 4px;
    color: var(--soft); font-size: 17px; line-height: 1.75;
}
.page-markdown > *:first-child { margin-top: 0; }
.page-markdown > *:last-child { margin-bottom: 0; }
.page-markdown p { margin: 0 0 1em; }
.page-empty { color: var(--dim); font-style: italic; }
.page-plaintext {
    white-space: pre-wrap; word-break: break-word;
    font-family: inherit; color: var(--soft); margin: 0;
}

/* Site status block - fills in a {site status} placeholder anywhere in a
   page's README.md content with a live snapshot of the collection: a row
   of stat cards, then a meta bar with "Up since" / "Last updated" / a
   trade-status pill. "Up since" and the trade status text both come from
   optional {up since: ...} / {trade status: ...} tokens elsewhere in
   README.md (see App.extractSiteConfig) - leave them out and that part of
   the bar just doesn't render. */
.site-status { margin: 28px 0; }
.stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
}
@media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
}
.stat-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px;
}
.stat-icon {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
}
.stat-icon svg { width: 19px; height: 19px; }
.stat-card-recordings .stat-icon { background: rgba(96, 165, 250, 0.12); color: var(--blue); }
.stat-card-size .stat-icon { background: rgba(167, 139, 250, 0.12); color: var(--purple); }
.stat-body { min-width: 0; }
.stat-value {
    font: 800 22px var(--sans); color: var(--text); line-height: 1.2;
    overflow-wrap: break-word;
}
.stat-label {
    font: 600 11px var(--mono-font); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
    white-space: nowrap;
}

.site-meta-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px 20px;
    margin-top: 12px; padding: 13px 18px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
}
.site-meta-info {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
    min-width: 0; color: var(--soft); font: 500 13px var(--sans);
}
.site-meta-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.site-meta-item svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
.site-meta-item strong { color: var(--text); font-weight: 700; }
.site-meta-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }

@media (max-width: 560px) {
    .site-meta-bar { flex-direction: column; align-items: flex-start; }
    .site-meta-info { flex-direction: column; align-items: flex-start; gap: 8px; }
    .site-meta-sep { display: none; }
}

.trade-status-pill {
    display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
    padding: 6px 12px; border-radius: 999px;
    font: 700 11px var(--mono-font); text-transform: uppercase; letter-spacing: 0.04em;
    border: 1px solid var(--line); color: var(--soft); background: var(--paper2);
}
.ts-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.trade-status-pill.ts-open {
    color: var(--accent); border-color: var(--accent); background: rgba(74, 222, 128, 0.1);
}
.trade-status-pill.ts-limited {
    color: var(--amber); border-color: var(--amber); background: rgba(251, 191, 36, 0.1);
}
.trade-status-pill.ts-closed {
    color: var(--red); border-color: var(--red); background: rgba(248, 113, 113, 0.1);
}

/* One control row: search (primary, takes remaining space), sort, and a
   single Filters toggle - replaces three previously separate rows
   (search / status+sort+toggles / filter chips). */
.control-row {
    display: flex; max-width: 820px; margin: 0 auto; gap: 8px; align-items: stretch;
}
.search-box { position: relative; flex: 1; }
.search-box svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
}
.search-box input {
    width: 100%; height: 48px; padding: 0 48px 0 45px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; outline: 0;
    font-family: var(--mono-font); font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.key {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 10px var(--mono-font); color: var(--dim);
    border: 1px solid var(--line); padding: 3px 6px; border-radius: 4px;
}
.clear {
    display: none; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px;
}

/* Search suggestions dropdown */
.search-suggestions {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--paper2); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35); overflow: hidden; z-index: 50;
    max-height: 260px; overflow-y: auto;
}
.suggestion-item {
    padding: 10px 16px; font: 13px var(--mono-font); color: var(--soft);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.suggestion-item:hover, .suggestion-item.active { background: var(--accent-soft); color: var(--text); }
.suggestion-item .highlight { background: var(--amber); color: #211a10; }
.suggestion-type {
    display: inline-block; min-width: 38px;
    font: 600 9px var(--mono-font); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--dim); margin-right: 8px;
}
.suggestion-item.active .suggestion-type, .suggestion-item:hover .suggestion-type { color: var(--muted); }

.control-row .sort {
    height: 48px; flex-shrink: 0; color: var(--soft); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 0 12px; font-size: 12px; cursor: pointer;
    transition: all 0.2s; font-family: var(--mono-font);
}
.control-row .sort:hover { border-color: var(--paper3); color: var(--text); }

.filters-toggle {
    height: 48px; flex-shrink: 0; position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 16px; white-space: nowrap;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--soft); font: 12px var(--mono-font);
    cursor: pointer; transition: all 0.2s;
}
.filters-toggle:hover { border-color: var(--paper3); color: var(--text); }
.filters-toggle[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.filters-chevron { transition: transform 0.25s var(--ease); }
.filters-toggle[aria-expanded="true"] .filters-chevron { transform: rotate(180deg); }
.filters-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none;
}
.filters-dot.show { display: inline-block; }

/* Filter panel - closed by default, opened via the Filters toggle above.
   Same grid-template-rows collapse technique as the Introduction section
   below, reusing the site's one existing motion pattern rather than
   inventing a second one. */
.filter-panel-wrap {
    max-width: 820px; margin: 0 auto;
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s var(--ease);
}
.filter-panel-wrap.open { grid-template-rows: 1fr; }
.filter-panel-inner { min-height: 0; overflow: hidden; }
.filter-panel {
    margin-top: 10px; padding: 14px 16px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    height: 26px; padding: 0 10px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--soft);
    font: 500 11px var(--mono-font);
    cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 4px;
}
.chip:hover { border-color: var(--paper3); color: var(--text); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip svg { width: 10px; height: 10px; }
.chip-clear { color: var(--red); border-color: transparent; }
.chip-clear:hover { border-color: var(--red); }

/* Year range slider - two overlapping native range inputs sharing one
   visual track, a common vanilla-JS technique for a dual-handle slider
   without a UI library. */
.year-range {
    display: flex; align-items: center; gap: 10px;
    height: 26px; padding: 0 4px;
}
.year-range-label {
    font: 500 11px var(--mono-font); color: var(--soft);
    white-space: nowrap; min-width: 82px;
}
.year-range-slider { position: relative; width: 140px; height: 26px; }
.range-track {
    position: absolute; top: 50%; left: 0; right: 0; height: 4px;
    transform: translateY(-50%); background: var(--line); border-radius: 2px;
}
.range-track-active {
    position: absolute; top: 50%; height: 4px;
    transform: translateY(-50%); background: var(--accent); border-radius: 2px;
}
.range-input {
    position: absolute; top: 0; left: 0; width: 100%; height: 26px;
    margin: 0; background: none; pointer-events: none;
    -webkit-appearance: none; appearance: none;
}
.range-input::-webkit-slider-runnable-track { -webkit-appearance: none; height: 26px; background: transparent; }
.range-input::-moz-range-track { height: 26px; background: transparent; border: 0; }
.range-input::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: all;
    width: 14px; height: 14px; margin-top: 6px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg); cursor: pointer;
}
.range-input::-moz-range-thumb {
    pointer-events: all; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg); cursor: pointer;
}
.range-input.range-min { z-index: 3; }
.range-input.range-max { z-index: 4; }

/* Markdown Styling with Nested Colors */
.page-markdown h1, .page-markdown h2, .page-markdown h3 { font-family: var(--sans); font-weight: 600; }
.page-markdown h1 { color: var(--text); font-size: 28px; }
/* H2 is the biggest heading on these pages on purpose: README.md's own
   "# Home"/"# Wants"/etc. top-level headings are structural (they pick
   which page a section becomes, see splitMarkdownSections) and never
   render as visible text, so whatever "##" heading opens a section's
   actual content is the first, biggest thing a visitor sees there - a
   hero title, not a mid-level subheading. */
.page-markdown h2 { color: var(--accent2); font-size: 46px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.page-markdown h3 { color: var(--purple); font-size: 21px; }
.page-markdown h4, .page-markdown h5, .page-markdown h6 {
    font-family: var(--sans); font-weight: 500; color: var(--muted);
}
.page-markdown h5 { font-size: 14px; letter-spacing: 0.02em; }
.page-markdown strong { color: var(--accent); font-weight: 700; }
.page-markdown em { color: var(--purple); font-style: italic; }
.page-markdown strong em, .page-markdown em strong { color: var(--amber); font-weight: 700; font-style: italic; }
.page-markdown a { color: var(--accent2); text-decoration: none; border-bottom: 1px solid transparent; }
.page-markdown a:hover { border-bottom-color: var(--accent2); }
.page-markdown code { font-family: var(--mono-font); font-size: 0.85em; background: var(--bg); padding: 2px 5px; border-radius: 4px; }
.page-markdown ul, .page-markdown ol { padding-left: 22px; }
.page-markdown li { margin: 4px 0; }

/* Opening title/subtitle pair: when a page's content starts with two
   headings back-to-back (nothing in between - e.g. "## My Rules" directly
   followed by "##### buy me a dinner first, won't ya?"), they're a title
   and its subtitle, so both get centered and pulled close together
   instead of sitting left-aligned like ordinary body headings. */
.page-markdown .md-open-title { text-align: center; margin: 0 0 2px; }
.page-markdown .md-open-subtitle { text-align: center; margin: -2px 0 30px; }
/* A title with no subtitle underneath it isn't butting up against
   anything, so it gets normal spacing before whatever comes next instead
   of the 2px meant to sit tight above a subtitle line. */
.page-markdown .md-open-title.md-open-title-solo { margin-bottom: 30px; }

.archive-head {
    margin: 28px 0 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px;
}
.archive-head-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px 16px;
}
.archive-heading { font: 600 24px var(--sans); margin: 0; color: #f0f7f2; }
.archive-head-controls { display: flex; align-items: center; gap: 10px; }
.status { color: var(--muted); font: 11px var(--mono-font); }
.tool {
    height: 28px; color: var(--soft); background: transparent;
    border: 1px solid var(--line); border-radius: 6px;
    padding: 0 10px; font-size: 11px; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono-font);
}
.tool:hover { border-color: var(--paper3); color: var(--text); }

/* Banner shown when a #show-name link has filtered the page to one show */
.slug-filter-banner {
    display: none; align-items: center; gap: 8px;
    color: var(--soft); font: 11px var(--mono-font); margin-top: 10px;
}
.slug-filter-banner.show { display: flex; }
.slug-filter-banner button {
    color: var(--accent2); background: none; border: 0; cursor: pointer;
    font: inherit; text-decoration: underline; padding: 0;
}

.group-details {
    border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 16px; overflow: hidden; background: var(--paper);
}
.group-summary {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; cursor: pointer; list-style: none;
    background: var(--paper2); border-bottom: 1px solid transparent; transition: background 0.2s;
}
.group-summary::-webkit-details-marker { display: none; }
.group-summary:hover { background: var(--paper3); }
.group-title { margin: 0; font: 600 18px var(--sans); flex: 1; color: var(--text); }
.group-count {
    font: 10px var(--mono-font); color: var(--accent);
    background: var(--accent-soft); padding: 4px 8px;
    border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em;
}
.group-chevron { width: 18px; height: 18px; color: var(--muted); transition: transform 0.25s var(--ease); }
.group-details[open] .group-summary { border-bottom-color: var(--line); }
.group-details[open] .group-chevron { transform: rotate(180deg); color: var(--accent2); }
.group-content { background: var(--bg); }

.record { border-bottom: 1px solid var(--line); }
.record:last-child { border-bottom: none; }
.record details { margin: 0; }
.record summary {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; list-style: none; cursor: pointer; transition: background 0.15s ease;
}
.record summary::-webkit-details-marker { display: none; }
.record summary:hover { background: rgba(255, 255, 255, 0.02); }
.record summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

.summary-title { flex: 1; min-width: 0; }
.title-line { font-size: 15px; font-weight: 600; color: #f1f7f3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-line {
    margin-top: 4px; color: var(--accent2);
    font: 11px var(--mono-font); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
}

/* Status pill in summary - red for "not available to trade", amber for a
   data-quality issue (corrupt/damaged/etc). Previously both were forced
   into the same red pill. */
.nft-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font: 600 10px var(--mono-font); text-transform: uppercase;
    border: 1px solid var(--line); color: var(--soft);
    white-space: nowrap; flex-shrink: 0;
}
.nft-pill svg { width: 10px; height: 10px; }
.nft-pill.nft-red {
    color: var(--red); border-color: var(--red);
    background: rgba(248, 113, 113, 0.1);
}
.nft-pill.nft-amber {
    color: var(--amber); border-color: var(--amber);
    background: rgba(251, 191, 36, 0.1);
}

/* Proshot badge (new - the desktop app already tracked this, it just was
   never published to the site) */
.proshot-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font: 600 10px var(--mono-font); text-transform: uppercase;
    border: 1px solid var(--purple); color: var(--purple);
    background: rgba(167, 139, 250, 0.1);
    white-space: nowrap; flex-shrink: 0;
}
.proshot-pill svg { width: 10px; height: 10px; }

/* Tracked/Untracked - Audio tab only (see app.js's record()). Tracked
   reuses the site's green accent (a completed/good state); Untracked
   uses amber, matching the desktop app's own default-state color choices
   elsewhere (e.g. the nft-pill amber for a data-quality note). */
.audio-tracked-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font: 600 10px var(--mono-font); text-transform: uppercase;
    white-space: nowrap; flex-shrink: 0;
}
.audio-tracked-pill svg { width: 10px; height: 10px; }
.audio-tracked-pill.tracked {
    border: 1px solid var(--accent); color: var(--accent);
    background: var(--accent-soft);
}
.audio-tracked-pill.untracked {
    border: 1px solid var(--amber); color: var(--amber);
    background: rgba(251, 191, 36, 0.1);
}

/* Disambiguation bubble - shown when two recordings in the same group
   would otherwise look identical in the collapsed summary row (e.g. same
   date, one matinee one evening); distinct from the status pills since
   it's informational, not a warning. */
.disambig-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font: 600 10px var(--mono-font); text-transform: uppercase;
    border: 1px solid var(--blue); color: var(--blue);
    background: rgba(96, 165, 250, 0.1);
    white-space: nowrap; flex-shrink: 0;
}

/* Informational flag bubble (Censored/Uncensored, ...) - same shape as the
   pills above but neutral, since not every flag is a problem; a flag that
   IS a data-quality issue (corrupt/damaged/etc, see classifyFlagText in
   app.js) gets the amber .nft-pill.nft-amber treatment instead. */
.flag-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 4px;
    font: 600 10px var(--mono-font); text-transform: uppercase;
    border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap; flex-shrink: 0;
}
.flag-pill svg { width: 10px; height: 10px; }

/* Summary Request Button */
.request-btn.summary-req {
    margin: 0; padding: 0; width: 30px; height: 30px;
    border-radius: 6px; justify-content: center; flex-shrink: 0;
}
.request-btn.summary-req svg { width: 14px; height: 14px; }

.chevron-icon { width: 16px; height: 16px; justify-self: end; color: var(--muted); transform: rotate(0deg); transition: transform 0.25s var(--ease); flex-shrink: 0; }
details[open] .chevron-icon { transform: rotate(180deg); color: var(--accent2); }

.record-body { padding: 0 18px 18px 18px; }
.record-body-inner {
    border-top: 1px solid var(--line); margin-top: 0; padding: 16px 0 0 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
}
.detail { display: flex; flex-direction: column; min-width: 0; }
.detail-label {
    color: var(--dim); font: 600 10px var(--mono-font);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px;
    display: flex; align-items: center; gap: 6px;
}
.detail-label svg { width: 12px; height: 12px; opacity: 0.8; stroke: currentColor; fill: none; stroke-width: 2; }
/* pre-line (not the default `normal`) so a literal line break typed into
   Cast, Master Notes or Trader Notes - e.g. to separate multiple
   recording versions - actually renders as one, instead of being
   collapsed into a single space like any other run of whitespace. Every
   other field using this class is single-line text with no embedded
   newlines, so this is a no-op for them. */
.detail-value { color: var(--soft); font-size: 13px; word-break: break-word; line-height: 1.5; white-space: pre-line; }
.detail.full { grid-column: 1 / -1; }

/* Cast names are deep links to that actor's own filtered page - see
   #videos/cast/<name> routing - styled to read as text first, link
   second, matching the rest of the card rather than looking like a
   generic web link. */
.cast-link { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--dim); transition: color 0.15s ease, border-color 0.15s ease; }
.cast-link:hover { color: var(--accent2); border-bottom-color: var(--accent2); }
.lead-line .cast-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Alternates/e-c/g-p/swings/standbys/understudies (see app.js's
   ALT_ROLE_RE) - name and role both get the same purple accent used for
   italics elsewhere on the site, so they read as a distinct "not the
   regular cast" category at a glance. */
.cast-alt { color: var(--purple); }
.cast-alt .cast-link { border-bottom-color: rgba(167, 139, 250, 0.4); }

.request-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 7px 14px; border: 1px solid var(--line);
    border-radius: 6px; background: transparent; color: var(--accent2);
    font: 600 11px var(--mono-font); text-transform: uppercase; letter-spacing: 0.05em;
    cursor: pointer; transition: all 0.2s ease;
}
.request-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.request-btn.requested { color: var(--bg); background: var(--accent); border-color: var(--accent); }
/* An item currently (or permanently) NFT can't be requested - grayed out,
   not-allowed cursor, and clicking it explains why (see the toast below)
   instead of silently doing nothing. */
.request-btn.nft-locked { color: var(--dim); opacity: 0.6; cursor: not-allowed; }
.request-btn.nft-locked:hover { background: transparent; border-color: var(--line); color: var(--dim); }

/* The horizontal padding gives the highlighted background some breathing
   room, but padding on an inline element also pushes the surrounding text
   away by that same amount - visible as a stray gap right at the edge of
   a partial-word match (e.g. "E[spar]za"). The matching negative margin
   cancels that push while leaving the padding (and the background box it
   creates) alone, so the highlighted span still looks inset but no longer
   shoves its neighbors apart. */
.highlight { background: var(--amber); color: #211a10; padding: 1px 3px; margin: 0 -3px; border-radius: 3px; font-weight: 600; }
.no-results { display: none; text-align: center; padding: 70px; color: var(--muted); font-family: var(--mono-font); }
.skeleton {
    height: 52px; border-bottom: 1px solid var(--line);
    background: var(--paper2); animation: shine 1.3s linear infinite;
}
@keyframes shine { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

/* Split Trade Request Pill */
.request-pill-group {
    position: fixed; right: 24px; bottom: 24px; display: none;
    border-radius: 999px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    overflow: hidden; z-index: 90;
}
.request-pill-group.show { display: flex; }
.pill-half {
    background: var(--accent); color: var(--bg);
    border: 0; padding: 12px 18px;
    font: 700 12px var(--mono-font); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.2s;
}
.pill-left { border-right: 1px solid rgba(0,0,0,0.2); }
.pill-half:hover { background: var(--accent2); }
.request-count {
    background: rgba(0,0,0,0.2); color: var(--bg);
    border-radius: 999px; padding: 2px 6px; font-size: 11px;
}

.back-top {
    position: fixed; left: 24px; bottom: 24px; display: none;
    padding: 10px 12px; background: var(--paper2); border: 1px solid var(--line);
    color: var(--muted); cursor: pointer; border-radius: 8px; z-index: 90;
}
.back-top.show { display: block; }
.back-top:hover { color: var(--text); border-color: var(--paper3); }

/* Small on-screen message for feedback that isn't worth a whole page
   reflow (an NFT-locked click, a form send success/failure). Reused
   wherever a brief "here's what happened" note is needed. */
.toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
    background: var(--paper2); border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 8px; font: 500 13px var(--sans);
    box-shadow: 0 12px 28px rgba(0,0,0,0.35); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 360px; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Contact form - EmailJS-powered, sits below the README-driven Contact
   markdown content, same content width as .page-markdown. */
.contact-form {
    max-width: 560px; margin: 0 auto; padding: 0 4px 60px;
    display: flex; flex-direction: column; gap: 16px;
}
.contact-form-title {
    font: 700 22px var(--sans); color: var(--text); margin: 0 0 4px; text-align: center;
}
.form-row { display: flex; flex-direction: column; gap: 6px; }
.form-row label {
    font: 600 11px var(--mono-font); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
}
.form-row .req-star { color: var(--red); }
.form-row input, .form-row select, .form-row textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: 14px var(--mono-font); color: var(--text);
    outline: 0; transition: border-color 0.2s, box-shadow 0.2s; resize: vertical;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-row select { cursor: pointer; }
/* Request Type: a two-way segmented pill instead of a <select> - one side
   always "on" (accent fill), the other dim, click either to switch. */
.cf-type-toggle {
    display: flex; width: fit-content; border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden;
}
.cf-type-option {
    padding: 9px 20px; border: 0; background: transparent; color: var(--muted);
    font: 600 12px var(--mono-font); text-transform: uppercase; letter-spacing: 0.04em;
    cursor: pointer; transition: all 0.2s ease;
}
.cf-type-option + .cf-type-option { border-left: 1px solid var(--line); }
.cf-type-option.active { background: var(--accent); color: var(--bg); }
.cf-type-option:not(.active):hover { color: var(--text); background: var(--paper2); }
.cf-items-list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    max-height: 260px; overflow-y: auto;
}
.cf-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
}
.cf-item:last-child { border-bottom: 0; }
.cf-item-text { font: 13px var(--mono-font); color: var(--text); line-height: 1.4; }
.cf-item-remove {
    flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); cursor: pointer; transition: all 0.2s ease; padding: 0;
}
.cf-item-remove svg { width: 12px; height: 12px; }
.cf-item-remove:hover { border-color: var(--red); color: var(--red); background: rgba(239, 68, 68, 0.1); }
.cf-items-empty {
    padding: 14px 12px; font: 13px var(--mono-font); color: var(--muted);
    text-align: center;
}
/* A requested item currently marked "Never Gift" - only shown while
   Request Type is Gift Request (see renderRequestedItemsPanel). */
.cf-item.cf-item-non-giftable { background: rgba(248, 113, 113, 0.08); }
.cf-item-flag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--red); color: var(--red); font: 700 10px var(--mono-font);
    text-transform: uppercase; letter-spacing: 0.04em; vertical-align: middle;
}
/* Blocks submitting a Gift Request while it still contains a "Never Gift"
   item - see updateGiftWarning() / the contactForm submit handler. */
.cf-gift-warning-box {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--red); border-radius: 8px;
    background: rgba(248, 113, 113, 0.1); color: var(--text); font: 13px var(--mono-font);
    line-height: 1.5;
}
.cf-gift-warning-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.cf-gift-warning-btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--red);
    background: transparent; color: var(--red); font: 700 12px var(--mono-font);
    text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
    transition: all 0.2s ease;
}
.cf-gift-warning-btn:hover { background: var(--red); color: var(--bg); }
.contact-form-submit {
    align-self: center; margin-top: 8px; padding: 12px 32px;
    background: var(--accent); color: var(--bg); border: 0; border-radius: 8px;
    font: 700 13px var(--mono-font); text-transform: uppercase; letter-spacing: 0.05em;
    cursor: pointer; transition: all 0.2s ease;
}
.contact-form-submit:hover { background: var(--accent2); }
.contact-form-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.contact-form-note { text-align: center; color: var(--muted); font-size: 13px; min-height: 1.2em; margin: 0; }

@media (max-width: 800px) {
    .record summary { flex-wrap: wrap; gap: 8px 12px; }
    .summary-title { flex-basis: 100%; }
    /* The title-line now carries title + production/venue + date all in
       one string (see app.js's record()) - on a phone-width row that's
       often too long for one line, and single-line ellipsis was cutting
       it off mid-word, sometimes losing the date entirely. Once
       .summary-title has the full row to itself (just above), there's no
       reason to still force one line - let it wrap instead. */
    .title-line { white-space: normal; overflow: visible; text-overflow: unset; }
    .proshot-pill { order: 4; }
    .audio-tracked-pill { order: 4; }
    .disambig-pill { order: 4; }
    .flag-pill { order: 4; }
    /* Previously forced to its own full-width row (flex-basis: 100%).
       That rule didn't distinguish the rare genuinely-long NFT message
       ("FOREVER EXCEPT THROUGH MASTER") from the everyday trading-status
       pill sharing this same class ("Giftable", "Never Gift") - so a
       short one-word pill stretched edge-to-edge on every single row.
       Treated like the other pills instead: it sizes to its own content
       and wraps onto a new line via the row's flex-wrap only when it
       doesn't fit, same as everything else here. */
    .nft-pill { order: 4; }
    .request-btn.summary-req { margin-left: auto; order: 5; }
    .chevron-icon { order: 6; }
}
@media (max-width: 600px) {
    .nav-inner { padding: 0 14px; }
    .nav-brand { padding: 14px 0; font-size: 17px; }
    .nav-link { height: 44px; padding: 0 10px; font-size: 13px; }
    .nav-link-cta { height: 32px; }
    .page { padding: 18px 14px 60px; }
    .control-row { flex-wrap: wrap; }
    .search-box { flex-basis: 100%; }
    .control-row .sort, .filters-toggle { flex: 1; justify-content: center; }
    .record summary { padding: 12px 14px; }
    .record-body { padding: 0 14px 16px 14px; }
    .back-top { display: none !important; }
    .request-pill-group { right: 16px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

<main class="page">

<script>
// All pure logic (escaping, dates, sorting, filtering, status
// classification, the record-card HTML builder, etc.) lives in app.js,
// loaded above as window.TradeListApp. This script only owns the DOM:
// fetching data, wiring events, and writing the results app.js hands back
// into the page.
const App = window.TradeListApp;
const $ = id => document.getElementById(id);

// ==== EmailJS configuration ====

const EMAILJS_SERVICE_ID = 'service_rkry3wk';
const EMAILJS_TEMPLATE_ID = 'template_11nl7cj';
const EMAILJS_PUBLIC_KEY = 'XSsTY7F4qugYDF2Gi';
const emailjsReady = typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY';
if (emailjsReady) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

// -- Toast: a brief on-screen note for feedback that doesn't need a full
// page reaction (an NFT-locked click, a form send result). -------------
let toastTimer;
function showToast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

let allData = [], dataById = new Map();
let currentQuery = '', sortMode = 'title-asc', requestedItems = [], searchTimer;
let activeResolutions = new Set(), proshotOnly = false, titleSlugFilter = '', castSlugFilter = '';
let yearBounds = null;               // {min, max} across the whole archive
let yearRange = { min: null, max: null }; // current slider selection; null bound = that side is unrestricted

// Which of the two shared "Videos"/"Audio" tabs is currently showing -
// 'Video' or 'Audio' (matching media_type values), or null before either
// has ever been visited. Drives currentMediaRows() below, so every
// filter/search/render on that shared page only ever sees its own kind.
let currentMediaType = null;

function isRequested(r) { return requestedItems.some(x => x.key === App.requestKey(r)); }

// Rows belonging to whichever of Videos/Audio is the active tab. A blank
// media_type is treated as 'Video' (pre-Audio-tab data, or a row where it
// was never set), matching archive_app.py's own default.
function currentMediaRows() {
    return allData.filter(r => (String(r.media_type || '').trim() || 'Video') === currentMediaType);
}

function render() {
    currentQuery = currentQuery || '';
    let q = currentQuery.trim().toLowerCase();
    let filtered = App.filterRows(currentMediaRows(), {
        query: q, resolutions: activeResolutions, yearRange, proshotOnly,
        titleSlug: titleSlugFilter, castSlug: castSlugFilter,
    });
    let rows = App.sortRows(filtered, sortMode);
    let html = '';
    // Title A-Z groups by show; Master A-Z groups by taper - both fold
    // into expand/collapse-able sections, just keyed differently. Deep-
    // linked into one specific show, though, "grouped by title" is
    // meaningless - there's only ever one title to group, so it behaves
    // like an ungrouped sort instead (the dropdown itself is left alone).
    let groupMode = sortMode === 'title-asc' ? 'title' : (sortMode === 'master-asc' ? 'master' : 'none');
    if (groupMode === 'title' && titleSlugFilter) groupMode = 'none';

    if (groupMode !== 'none' && rows.length > 0) {
        let groups = groupMode === 'title' ? App.groupByTitle(rows) : App.groupByMaster(rows);
        let summaryKeyFn = groupMode === 'title'
            ? (r => App.fmtDate(r.date, r.sequence_number))
            : (r => r.title);
        for (const [groupName, rs] of groups) {
            let disambigLabels = App.computeDisambiguationLabels(rs, summaryKeyFn);
            // Grouped by title, this header IS the show title - acronym
            // search ("tbom" -> "The Book of Mormon") needs to work here
            // too, not just on the title-line inside each record. Grouped
            // by master, groupName is a taper's name instead - not a
            // title, so it stays on the plain substring hi().
            let groupNameHtml = groupMode === 'title' ? App.hiTitle(groupName, q) : App.hi(groupName, q);
            html += `
            <details class="group-details" open>
                <summary class="group-summary">
                    <h3 class="group-title">${groupNameHtml}</h3>
                    <span class="group-count">${rs.length} REC</span>
                    <span class="group-chevron">${App.ICONS.chevron}</span>
                </summary>
                <div class="group-content">
                    ${rs.map(r => App.record(r, q, groupMode, isRequested(r), disambigLabels.get(r) || '', castSlugFilter)).join('')}
                </div>
            </details>`;
        }
    } else {
        html = rows.map(r => App.record(r, q, 'none', isRequested(r), '', castSlugFilter)).join('');
    }

    $('archiveContainer').innerHTML = html;
    $('noResults').style.display = rows.length ? 'none' : 'block';
    let yearFilterActive = yearBounds && (yearRange.min !== yearBounds.min || yearRange.max !== yearBounds.max);
    let anyFilterActive = q || activeResolutions.size || yearFilterActive || proshotOnly || titleSlugFilter || castSlugFilter;
    $('statusText').textContent = anyFilterActive
        ? `${rows.length} of ${currentMediaRows().length} recordings`
        : `${currentMediaRows().length} recordings`;
    updateToggleStates();
}

function buildFilterChips() {
    const resolutions = App.distinctResolutions(currentMediaRows());
    $('resolutionChips').innerHTML = resolutions.map(r =>
        `<button type="button" class="chip" data-res="${App.esc(r)}" aria-pressed="false">${App.esc(r)}</button>`).join('');

    yearBounds = App.getYearBounds(currentMediaRows());
    if (yearBounds) {
        $('yearMin').min = $('yearMax').min = yearBounds.min;
        $('yearMin').max = $('yearMax').max = yearBounds.max;
        $('yearMin').value = yearBounds.min;
        $('yearMax').value = yearBounds.max;
        yearRange = { min: yearBounds.min, max: yearBounds.max };
        $('yearRange').style.display = yearBounds.min === yearBounds.max ? 'none' : 'flex';
        updateYearRangeVisual();
    } else {
        $('yearRange').style.display = 'none';
    }
}

function updateYearRangeVisual() {
    if (!yearBounds) return;
    const minVal = +$('yearMin').value, maxVal = +$('yearMax').value;
    const span = yearBounds.max - yearBounds.min || 1;
    const pctMin = ((minVal - yearBounds.min) / span) * 100;
    const pctMax = ((maxVal - yearBounds.min) / span) * 100;
    $('yearRangeActiveTrack').style.left = pctMin + '%';
    $('yearRangeActiveTrack').style.width = (pctMax - pctMin) + '%';
    $('yearRangeLabel').textContent = (minVal === yearBounds.min && maxVal === yearBounds.max)
        ? 'All years' : `${minVal} \u2013 ${maxVal}`;
}

$('yearMin').addEventListener('input', () => {
    if (+$('yearMin').value > +$('yearMax').value) $('yearMin').value = $('yearMax').value;
    yearRange = { min: +$('yearMin').value, max: +$('yearMax').value };
    updateYearRangeVisual();
    updateClearFiltersVisibility();
    render();
});
$('yearMax').addEventListener('input', () => {
    if (+$('yearMax').value < +$('yearMin').value) $('yearMax').value = $('yearMin').value;
    yearRange = { min: +$('yearMin').value, max: +$('yearMax').value };
    updateYearRangeVisual();
    updateClearFiltersVisibility();
    render();
});

// -- Filters toggle (panel is closed by default; a dot on the toggle
// button shows whether anything is actually filtering the list) ---------
$('filtersToggle').addEventListener('click', () => {
    const open = $('filterPanelWrap').classList.toggle('open');
    $('filtersToggle').setAttribute('aria-expanded', String(open));
});

function updateClearFiltersVisibility() {
    const yearFilterActive = yearBounds && (yearRange.min !== yearBounds.min || yearRange.max !== yearBounds.max);
    const anyActive = activeResolutions.size > 0 || yearFilterActive || proshotOnly;
    $('clearFiltersBtn').style.display = anyActive ? '' : 'none';
    $('filtersDot').classList.toggle('show', anyActive);
}

// -- Smart Toggle Logic ------------------------------------------------
function updateToggleStates() {
    const shows = document.querySelectorAll('#archiveContainer .group-details');
    const recs = document.querySelectorAll('#archiveContainer .record details');

    const showsBtn = document.getElementById('toggleShowsBtn');
    const recsBtn = document.getElementById('toggleRecsBtn');

    showsBtn.style.display = shows.length > 0 ? '' : 'none';
    recsBtn.style.display = recs.length > 0 ? '' : 'none';

    if (shows.length > 0) {
        const allShowsOpen = Array.from(shows).every(s => s.open);
        const noun = sortMode === 'master-asc' ? 'masters' : 'shows';
        showsBtn.textContent = allShowsOpen ? `Collapse ${noun}` : `Expand ${noun}`;
    }
    if (recs.length > 0) {
        const allRecsOpen = Array.from(recs).every(r => r.open);
        recsBtn.textContent = allRecsOpen ? 'Collapse recs' : 'Expand recs';
    }
}

document.getElementById('toggleShowsBtn').addEventListener('click', function () {
    const shows = document.querySelectorAll('#archiveContainer .group-details');
    if (shows.length === 0) return;
    const allOpen = Array.from(shows).every(s => s.open);
    shows.forEach(s => s.open = !allOpen);
    updateToggleStates();
});

document.getElementById('toggleRecsBtn').addEventListener('click', function () {
    const recs = document.querySelectorAll('#archiveContainer .record details');
    if (recs.length === 0) return;
    const allOpen = Array.from(recs).every(r => r.open);
    recs.forEach(r => r.open = !allOpen);
    updateToggleStates();
});

document.getElementById('archiveContainer').addEventListener('toggle', function (e) {
    if (e.target.classList.contains('group-details') || e.target.closest('.record')) {
        updateToggleStates();
    }
}, true);

// -- Faceted filter chips ------------------------------------------------
$('filterPanelWrap').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip || chip.id === 'clearFiltersBtn') return;
    const nowActive = chip.classList.toggle('active');
    chip.setAttribute('aria-pressed', String(nowActive));
    if (chip.dataset.res) {
        nowActive ? activeResolutions.add(chip.dataset.res) : activeResolutions.delete(chip.dataset.res);
    } else if (chip.dataset.proshot) {
        proshotOnly = nowActive;
    }
    updateClearFiltersVisibility();
    render();
});

// Shared by the "Clear filters" button and by switching between the
// Videos/Audio tabs (a resolution or year range picked on one tab
// shouldn't silently carry over and hide rows on the other).
function resetFilterState() {
    activeResolutions.clear(); proshotOnly = false;
    if (yearBounds) {
        $('yearMin').value = yearBounds.min;
        $('yearMax').value = yearBounds.max;
        yearRange = { min: yearBounds.min, max: yearBounds.max };
        updateYearRangeVisual();
    }
    document.querySelectorAll('#filterPanelWrap .chip.active').forEach(c => {
        c.classList.remove('active');
        c.setAttribute('aria-pressed', 'false');
    });
    updateClearFiltersVisibility();
}

$('clearFiltersBtn').addEventListener('click', () => {
    resetFilterState();
    render();
});

// -- Request basket ---------------------------------------------------
$('archiveContainer').addEventListener('click', e => {
    let locked = e.target.closest('[data-nft-locked]');
    if (locked) {
        e.preventDefault(); e.stopPropagation();
        showToast('This recording cannot be requested as it is NFT.');
        return;
    }
    let b = e.target.closest('[data-request]');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    let r = dataById.get(b.dataset.request);
    if (!r) return;
    let key = App.requestKey(r);
    let i = requestedItems.findIndex(x => x.key === key);
    if (i >= 0) {
        requestedItems.splice(i, 1);
        b.classList.remove('requested');
        b.innerHTML = App.ICONS.plus;
    } else {
        requestedItems.push({
            key,
            id: r.id != null ? r.id : '',
            title: r.title || '',
            date: App.fmtDate(r.date, r.sequence_number),
            master: r.master || '',
        });
        b.classList.add('requested');
        b.innerHTML = App.ICONS.check;
    }
    updateRequests();
});

// -- Gift Request vs "Never Gift" items --------------------------------
// A recording whose trading_status contains "Never Gift" can still be
// traded, just not given away - so Gift Request is the one Request Type
// it has to be blocked from going out under. cfRequestType (set further
// below) and dataById (populated once data.json loads) are both read
// here rather than passed in, same as the rest of this basket code.
function isNonGiftableItem(x) {
    let row = dataById.get(String(x.id));
    let status = row ? row.trading_status : '';
    return /never\s*gift/i.test(String(status || ''));
}

function nonGiftableRequestedItems() {
    return requestedItems.filter(isNonGiftableItem);
}

// Shows/hides the red "you can't gift these" box in the contact form and
// keeps its message in sync with the current basket + Request Type. Also
// the single source of truth the submit handler checks before sending.
function updateGiftWarning() {
    let box = $('cfGiftWarning');
    if (cfRequestType !== 'Gift Request') {
        box.style.display = 'none';
        return;
    }
    let bad = nonGiftableRequestedItems();
    if (!bad.length) {
        box.style.display = 'none';
        return;
    }
    box.style.display = '';
    let count = bad.length;
    let names = bad.map(x => x.title).join(', ');
    $('cfGiftWarningText').textContent =
        `You have ${count} item${count === 1 ? '' : 's'} marked "Never Gift" in this request` +
        ` (${names}). Remove ${count === 1 ? 'it' : 'them'} or switch to a Trade Request before sending.`;
}

$('cfRemoveNonGiftableBtn').addEventListener('click', () => {
    nonGiftableRequestedItems().forEach(x => removeRequestedItem(x.key));
});

$('cfSwitchToTradeBtn').addEventListener('click', () => setRequestType('Trade Request'));

function updateRequests() {
    $('requestCount').textContent = requestedItems.length;
    $('requestPill').classList.toggle('show', requestedItems.length > 0);
    renderRequestedItemsPanel();
    updateGiftWarning();
}

// Removes one item from the basket from wherever it's triggered (the
// contact form's item list, currently) - splices the shared state, resets
// the matching "+"/check button back to normal if it's on-screen right now
// (the Videos page's own record markup isn't rebuilt just because the
// basket changed elsewhere), and refreshes the pill + panel.
function removeRequestedItem(key) {
    let i = requestedItems.findIndex(x => x.key === key);
    if (i < 0) return;
    let [removed] = requestedItems.splice(i, 1);
    if (removed && removed.id !== '' && removed.id != null) {
        let btn = document.querySelector(`#archiveContainer [data-request="${CSS.escape(String(removed.id))}"]`);
        if (btn) {
            btn.classList.remove('requested');
            btn.innerHTML = App.ICONS.plus;
        }
    }
    updateRequests();
}

function buildRequestBody() {
    return requestedItems.map((x, i) =>
        `${i + 1}. ${x.title}${x.date ? ' - ' + x.date : ''}${x.master ? ' - ' + x.master : ''}`
    ).join('\n');
}

// A bare comma-separated list of the underlying recording IDs (matching
// data.json's "id" field) - sent alongside the human-readable list above
// so a parser on the receiving end can go straight from the email to the
// right links without matching against titles/dates by hand.
function buildRequestedIds() {
    return requestedItems.map(x => x.id).filter(id => id !== '' && id != null).join(',');
}

// The contact form's "Requested Items" panel: a live view of the same
// basket the "+" buttons and the request pill share, each row removable
// with its own "x" so someone can trim their list right before sending.
function renderRequestedItemsPanel() {
    let list = $('cfItemsList');
    if (!requestedItems.length) {
        list.innerHTML = `<li class="cf-items-empty">You haven't added any recordings to your request list.</li>`;
        return;
    }
    // The "Never Gift" flag only means anything while asking for a gift -
    // the same item on a Trade Request is perfectly fine, so it's only
    // shown/checked here when cfRequestType actually is Gift Request.
    let flagNonGiftable = cfRequestType === 'Gift Request';
    list.innerHTML = requestedItems.map(x => {
        let nonGiftable = flagNonGiftable && isNonGiftableItem(x);
        return `
        <li class="cf-item${nonGiftable ? ' cf-item-non-giftable' : ''}" data-key="${App.esc(x.key)}">
            <span class="cf-item-text">${App.esc(x.title)}${x.date ? ' - ' + App.esc(x.date) : ''}${x.master ? ' - ' + App.esc(x.master) : ''}${nonGiftable ? ' <span class="cf-item-flag">Never Gift</span>' : ''}</span>
            <button type="button" class="cf-item-remove" data-remove-key="${App.esc(x.key)}" title="Remove from request" aria-label="Remove ${App.esc(x.title)} from request">${App.ICONS.close}</button>
        </li>`;
    }).join('');
}
renderRequestedItemsPanel(); // paint the empty-state message on first load

$('cfItemsList').addEventListener('click', e => {
    let b = e.target.closest('[data-remove-key]');
    if (!b) return;
    removeRequestedItem(b.dataset.removeKey);
});

$('copyRequestBtn').addEventListener('click', () => {
    if (!requestedItems.length) return;
    let body = buildRequestBody();
    navigator.clipboard.writeText(body).then(() => {
        const textEl = $('copyBtnText');
        const originalText = textEl.textContent;
        textEl.textContent = `Copied ${requestedItems.length} items!`;
        setTimeout(() => textEl.textContent = originalText, 2500);
    }).catch(err => console.error('Copy failed:', err));
});

$('emailRequestBtn').addEventListener('click', () => {
    if (!requestedItems.length) return;
    goToPage('contact');
    setTimeout(() => {
        setRequestType('Trade Request');
        $('contactForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        $('cfName').focus();
    }, 50);
});

// -- Contact form: EmailJS instead of mailto: --------------------------
// Request Type used to be a <select>; it's now a two-way segmented pill
// (see .cf-type-toggle) - one button always carries .active, the other is
// dimmed, and clicking either switches which one does. cfRequestType is
// the single source of truth other code (URL-field visibility, the
// EmailJS payload) reads from.
let cfRequestType = 'Trade Request';

function setRequestType(type) {
    cfRequestType = type;
    document.querySelectorAll('#cfTypeToggle .cf-type-option').forEach(btn => {
        let isActive = btn.dataset.type === type;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
    });
    updateContactUrlRequirement();
    renderRequestedItemsPanel();
    updateGiftWarning();
}

$('cfTypeToggle').addEventListener('click', e => {
    let b = e.target.closest('.cf-type-option');
    if (!b) return;
    setRequestType(b.dataset.type);
});

function updateContactUrlRequirement() {
    let isTrade = cfRequestType === 'Trade Request';
    $('cfUrlRow').style.display = isTrade ? '' : 'none';
    $('cfUrl').required = isTrade;
    if (!isTrade) $('cfUrl').value = '';
}
updateContactUrlRequirement();

$('contactForm').addEventListener('submit', e => {
    e.preventDefault();
    let form = $('contactForm');
    if (!form.reportValidity()) return;

    // Hard block: a Gift Request can't go out while it still contains a
    // "Never Gift" item - updateGiftWarning() already keeps the box/count
    // in sync on every basket or Request Type change, so this just
    // re-checks the same thing and refuses to send if it's still true.
    if (cfRequestType === 'Gift Request' && nonGiftableRequestedItems().length > 0) {
        updateGiftWarning();
        $('cfGiftWarning').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }

    if (!emailjsReady) {
        showToast('Automatic email system failed - please email MrLeoD96@gmail.com directly for now.');
        return;
    }

    // Two shapes of the same basket, for two different readers: a
    // numbered, human-readable list (title - date - master) for the email
    // body, and a bare comma-separated list of the underlying recording
    // IDs (matching data.json's "id" field) meant for a parser on my end -
    // paste it in and go straight to pulling the right links, no manual
    // matching against titles/dates.
    let templateParams = {
        request_type: cfRequestType,
        from_name: $('cfName').value,
        from_email: $('cfEmail').value,
        reply_to: $('cfEmail').value,
        trading_list_url: $('cfUrl').value,
        message: $('cfMessage').value,
        requested_items: buildRequestBody(),
        requested_ids: buildRequestedIds(),
    };

    let submitBtn = $('cfSubmit');
    let originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams).then(() => {
        showToast('Thanks! Your message has been sent.');
        form.reset();
        setRequestType('Trade Request');
        requestedItems.length = 0;
        document.querySelectorAll('#archiveContainer .request-btn.requested').forEach(btn => {
            btn.classList.remove('requested');
            btn.innerHTML = App.ICONS.plus;
        });
        updateRequests();
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
    }).catch(err => {
        console.error('EmailJS send failed:', err);
        showToast('Something went wrong sending your message - please try again or email MrLeoD96@gmail.com directly.');
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
    });
});

// -- Search + suggestions (Google-style autocomplete, shows AND cast) -----
let suggestionItems = [], activeSuggestionIndex = -1;

function setSearchValue(value) {
    $('searchInput').value = value;
    const hasValue = !!value;
    $('clearSearch').style.display = hasValue ? 'block' : 'none';
    $('searchKeyHint').style.display = hasValue ? 'none' : 'block';
}

function updateSuggestions(query) {
    const q = query.trim().toLowerCase();
    if (!q) { hideSuggestions(); return; }
    // Diacritic-insensitive, same as the main search and the highlighting
    // in App.record - typing "raul" should surface "Raúl Esparza".
    const foldedQ = App.foldDiacritics(q);

    // Title acronym match ("tbom" -> "The Book of Mormon") counts as a
    // suggestion hit too, same as it does for the main search below -
    // cast names don't get this, only show titles.
    const titleMatches = Array.from(new Set(currentMediaRows().map(r => r.title).filter(Boolean)))
        .filter(t => App.foldDiacritics(t.toLowerCase()).includes(foldedQ) || App.titleHasAcronymMatch(t, foldedQ))
        .slice(0, 5)
        .map(label => ({ type: 'show', label, slug: App.slugify(label) }));

    const castMatches = App.distinctCastNames(currentMediaRows())
        .filter(n => App.foldDiacritics(n.toLowerCase()).includes(foldedQ))
        .slice(0, 5)
        .map(label => ({ type: 'cast', label, slug: App.slugify(label) }));

    const matches = [...titleMatches, ...castMatches].slice(0, 8);
    if (!matches.length) { hideSuggestions(); return; }

    suggestionItems = matches;
    activeSuggestionIndex = -1;
    $('searchSuggestions').innerHTML = matches.map((m, i) =>
        `<div class="suggestion-item" role="option" data-index="${i}">` +
        `<span class="suggestion-type">${m.type === 'show' ? 'Show' : 'Cast'}</span>` +
        `${m.type === 'show' ? App.hiTitle(m.label, q) : App.hi(m.label, q)}</div>`
    ).join('');
    $('searchSuggestions').style.display = 'block';
}

function hideSuggestions() {
    $('searchSuggestions').style.display = 'none';
    $('searchSuggestions').innerHTML = '';
    suggestionItems = [];
    activeSuggestionIndex = -1;
}

function highlightActiveSuggestion() {
    const items = $('searchSuggestions').querySelectorAll('.suggestion-item');
    items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestionIndex));
    if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
        items[activeSuggestionIndex].scrollIntoView({ block: 'nearest' });
    }
}

// Selecting a suggestion (click, or Enter while highlighted) drops you
// into a deep link rather than doing a plain text search: a show
// suggestion goes to #videos/<show>, a cast suggestion goes to
// #videos/cast/<name> - every recording featuring that person, with their
// name highlighted throughout (see App.record's castHighlightSlug).
function selectSuggestion(item) {
    hideSuggestions();
    setSearchValue('');
    currentQuery = '';
    const targetPage = currentMediaType === 'Audio' ? 'audio' : 'videos';
    if (item.type === 'cast') goToPage(targetPage, '', item.slug);
    else goToPage(targetPage, item.slug);
}

$('searchInput').addEventListener('input', e => {
    const hasValue = !!e.target.value;
    $('clearSearch').style.display = hasValue ? 'block' : 'none';
    $('searchKeyHint').style.display = hasValue ? 'none' : 'block';
    updateSuggestions(e.target.value);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentQuery = e.target.value; render(); }, 150);
});

$('searchInput').addEventListener('focus', () => {
    if ($('searchInput').value) updateSuggestions($('searchInput').value);
});
$('searchInput').addEventListener('blur', () => {
    setTimeout(hideSuggestions, 150); // delay so a click on a suggestion registers first
});

$('searchSuggestions').addEventListener('mousedown', e => {
    const item = e.target.closest('.suggestion-item');
    if (!item) return;
    selectSuggestion(suggestionItems[+item.dataset.index]);
});

$('clearSearch').addEventListener('click', () => {
    setSearchValue('');
    currentQuery = ''; render(); hideSuggestions(); $('searchInput').focus();
});

$('searchInput').addEventListener('keydown', e => {
    const suggestionsOpen = $('searchSuggestions').style.display === 'block';
    if (e.key === 'ArrowDown' && suggestionsOpen) {
        e.preventDefault();
        activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, suggestionItems.length - 1);
        highlightActiveSuggestion();
    } else if (e.key === 'ArrowUp' && suggestionsOpen) {
        e.preventDefault();
        activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, -1);
        highlightActiveSuggestion();
    } else if (e.key === 'Enter' && suggestionsOpen && activeSuggestionIndex >= 0) {
        e.preventDefault();
        selectSuggestion(suggestionItems[activeSuggestionIndex]);
    } else if (e.key === 'Escape') {
        if (suggestionsOpen) {
            hideSuggestions();
        } else if ($('searchInput').value) {
            setSearchValue('');
            currentQuery = ''; render();
        }
    }
});

document.addEventListener('keydown', e => {
    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault(); $('searchInput').focus();
    }
});

$('sortSelect').addEventListener('change', e => { sortMode = e.target.value; render(); });

window.addEventListener('scroll', () => { $('backTop').classList.toggle('show', scrollY > 600); }, { passive: true });
$('backTop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

// -- Routing: #home, #videos, #wants, #rules, #contact switch pages;
// #videos/show-name additionally filters the Videos page to that show
// (build these by hand - lowercase the title, spaces to hyphens - there's
// no per-recording link, only per-show). Unknown/empty hashes fall back to
// Home, matching "first tab is Home" from the nav itself. -----------------
const PAGES = ['home', 'videos', 'audio', 'wants', 'rules', 'contact'];

function parseRoute() {
    const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const parts = raw.split('/').filter(Boolean);
    const page = PAGES.includes(parts[0]) ? parts[0] : 'home';
    // Videos and Audio share the same slug/cast deep-link shape - only
    // which media_type currentMediaRows() filters to differs.
    const isMediaPage = page === 'videos' || page === 'audio';
    const isCast = isMediaPage && parts[1] === 'cast' && parts[2];
    const castSlug = isCast ? parts[2].trim().toLowerCase() : '';
    const slug = isMediaPage && !isCast && parts[1] ? parts[1].trim().toLowerCase() : '';
    return { page, slug, castSlug };
}

function goToPage(page, slug, castSlug) {
    let hash = page;
    if (castSlug) hash += '/cast/' + castSlug;
    else if (slug) hash += '/' + slug;
    location.hash = hash;
}

// Sets the "Videos" heading above the archive list: the generic label by
// default, or - deep-linked into one show or one performer - a heading
// that names them "in big" rather than relying solely on the small banner
// link below it.
function updateArchiveHeading(titleMatch, castName) {
    let label = currentMediaType === 'Audio' ? 'Audio' : 'Videos';
    let text = label;
    if (titleMatch) text = `${label} of ${titleMatch}`;
    else if (castName) text = `${label} with ${castName}`;
    $('archiveHeading').textContent = text;
}

function renderRoute() {
    const { page, slug, castSlug } = parseRoute();
    // Audio has no page-section of its own - it reuses the Videos markup
    // (search bar, filter panel, archive list) and just switches which
    // rows currentMediaRows() hands to it.
    document.querySelectorAll('.page-section').forEach(s => {
        const active = s.dataset.page === page || (s.dataset.page === 'videos' && page === 'audio');
        s.classList.toggle('active', active);
    });
    document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.page === page));

    if (page === 'videos' || page === 'audio') {
        const newMediaType = page === 'audio' ? 'Audio' : 'Video';
        const mediaTypeChanged = newMediaType !== currentMediaType;
        currentMediaType = newMediaType;
        if (mediaTypeChanged) {
            // A resolution/proshot/year filter picked on one tab shouldn't
            // silently apply (or hide everything) on the other, and the
            // filter chips themselves (resolutions, year bounds) need
            // rebuilding from this tab's own rows.
            buildFilterChips();
            resetFilterState();
        }
        titleSlugFilter = slug;
        castSlugFilter = castSlug;
        if (slug) {
            const match = currentMediaRows().find(r => App.slugify(r.title).includes(slug));
            updateArchiveHeading(match ? match.title : `"${slug}"`, '');
            $('slugFilterBanner').classList.add('show');
        } else if (castSlug) {
            const match = currentMediaRows().flatMap(r => App.parseCastNames(r.cast))
                .find(name => App.slugify(name).includes(castSlug));
            updateArchiveHeading('', match || `"${castSlug}"`);
            $('slugFilterBanner').classList.add('show');
        } else {
            updateArchiveHeading('', '');
            $('slugFilterBanner').classList.remove('show');
        }
        if (!dataLoadFailed) render();
    }
    window.scrollTo(0, 0);
}

$('clearSlugFilter').addEventListener('click', () => goToPage('videos'));
window.addEventListener('hashchange', renderRoute);

// -- Last updated: the timestamp baked into data.json by export_db.py.
// Stored globally (rather than passed around) because the {site status}
// stat grid can now appear anywhere, possibly more than once, and each
// copy needs the same value once it's known - see .stat-last-updated
// below, a class rather than an id for exactly that reason. -------------
let generatedAtGlobal = null;

function formatLastUpdatedText(generatedAt) {
    if (!generatedAt) return null;
    const d = new Date(generatedAt);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function applyLastUpdatedText(text) {
    document.querySelectorAll('.stat-last-updated-value').forEach(el => {
        el.textContent = text;
    });
}

function renderLastUpdated() {
    applyLastUpdatedText(formatLastUpdatedText(generatedAtGlobal) || 'Unknown');
}

// -- Static pages (Home/Wants/Rules/Contact) are entirely README-driven:
// a top-level "# Home", "# Wants", "# Rules", "# Contact" section in
// README.md becomes that page's content, verbatim. Videos is not on this
// list - it's the interactive archive above, not markdown. -----------------
function renderPageMarkdown(elementId, markdown, label) {
    const el = $(elementId);
    if (markdown && markdown.trim()) {
        // marked is loaded from an external CDN - if it's blocked (ad
        // blocker, offline, a flaky network) don't pretend the section is
        // missing, just show it as plain text instead of losing the content.
        let usedMarked = typeof marked !== 'undefined' && !!marked.parse;
        let html = usedMarked
            ? marked.parse(markdown)
            : `<pre class="page-plaintext">${App.esc(markdown)}</pre>`;

        // A "{site status}" placeholder anywhere in the section is swapped
        // for a live stat-card grid, right where it was written (also
        // stripping the <p> tags marked.js wraps a lone placeholder line
        // in).
        if (html.includes('{site status}')) {
            const statsHtml = getStatsHtml();
            html = html.replace(/<p>\{site status\}<\/p>/gi, statsHtml)
                       .replace(/\{site status\}/gi, statsHtml);
        }
        el.innerHTML = html;
        // Title+subtitle centering only makes sense for real rendered
        // headings, not the plaintext-fallback <pre> block.
        if (usedMarked) applyOpeningTitlePair(el);
    } else {
        el.innerHTML = `<p class="page-empty">Add a <code># ${App.esc(label)}</code> section to your README.md to populate this page.</p>`;
    }
}

// A section's opening heading always gets centered as the page's title -
// whether or not anything follows it. If it's immediately followed by a
// second heading (nothing in between), that one is treated as its
// subtitle - typically an H2 followed by a small H5 - and centered too,
// tight underneath, rather than left-aligned like ordinary body headings.
const HEADING_TAGS = new Set(['H1', 'H2', 'H3', 'H4', 'H5', 'H6']);
function applyOpeningTitlePair(el) {
    const first = el.firstElementChild;
    if (!first || !HEADING_TAGS.has(first.tagName)) return;
    first.classList.add('md-open-title');
    const second = first.nextElementSibling;
    if (second && HEADING_TAGS.has(second.tagName)) {
        second.classList.add('md-open-subtitle');
    } else {
        // No subtitle to sit close to it - give it normal breathing room
        // before whatever comes next instead of the tight 2px meant to
        // butt up against a subtitle line.
        first.classList.add('md-open-title-solo');
    }
}

function getStatsHtml() {
    const stats = App.computeStats(allData);
    const lastMod = formatLastUpdatedText(generatedAtGlobal) || 'Unknown';
    const upSince = (siteConfig && siteConfig.upSince) || null;
    const tradeStatusText = (siteConfig && siteConfig.tradeStatus) || null;
    const level = App.classifyTradeStatus(tradeStatusText);
    const statusHtml = tradeStatusText
        ? `<span class="trade-status-pill ts-${level}"><span class="ts-dot"></span>${App.esc(tradeStatusText)}</span>`
        : '';
    const upSinceHtml = upSince
        ? `<span class="site-meta-item">${App.ICONS.clock}Up since <strong>${App.esc(upSince)}</strong></span><span class="site-meta-sep"></span>`
        : '';
    return `
    <div class="site-status">
        <div class="stats-grid">
            <div class="stat-card stat-card-shows">
                <span class="stat-icon">${App.ICONS.film}</span>
                <div class="stat-body"><div class="stat-value">${stats.showCount}</div><div class="stat-label">Shows</div></div>
            </div>
            <div class="stat-card stat-card-recordings">
                <span class="stat-icon">${App.ICONS.monitor}</span>
                <div class="stat-body"><div class="stat-value">${stats.recordingCount}</div><div class="stat-label">Recordings</div></div>
            </div>
            <div class="stat-card stat-card-size">
                <span class="stat-icon">${App.ICONS.hdd}</span>
                <div class="stat-body"><div class="stat-value">${stats.totalSizeText}</div><div class="stat-label">Collection Size</div></div>
            </div>
        </div>
        <div class="site-meta-bar">
            <div class="site-meta-info">
                ${upSinceHtml}<span class="site-meta-item">${App.ICONS.history}Last updated <strong class="stat-last-updated-value">${lastMod}</strong></span>
            </div>
            ${statusHtml}
        </div>
    </div>`;
}

function renderStaticPages() {
    const sections = readmeSections || {};
    renderPageMarkdown('homeContent', sections['home'], 'Home');
    renderPageMarkdown('wantsContent', sections['wants'], 'Wants');
    renderPageMarkdown('rulesContent', sections['rules'], 'Rules');
    renderPageMarkdown('contactContent', sections['contact'], 'Contact');
    // Any {site status} grid(s) just got rendered with a placeholder/best-
    // effort date - fill in the real one (or kick off the GitHub fallback)
    // once, now that all sections exist in the DOM.
    renderLastUpdated();
}

let readmeSections = null;
let dataLoadFailed = false;
// {up since: ...} / {trade status: ...} tokens pulled out of README.md -
// see App.extractSiteConfig. Populated once README.md resolves, read by
// getStatsHtml() when it builds the {site status} block.
let siteConfig = {};

// README.md and data.json load in parallel; the static pages (which may
// need real numbers for the {site status} stat grid) aren't rendered
// until BOTH have settled, one way or the other - rendering Home the
// moment README.md lands would otherwise show "0 shows / 0 videos" if it
// happened to resolve before data.json did.
const readmeReady = fetch('README.md').then(r => r.ok ? r.text() : '').then(text => {
    const cfg = App.extractSiteConfig(text || '');
    siteConfig = cfg;
    readmeSections = App.splitMarkdownSections(cfg.cleaned || '');
}).catch(() => { readmeSections = {}; siteConfig = {}; });

const dataReady = fetch('data.json').then(r => { if (!r.ok) throw Error('data'); return r.json(); }).then(d => {
    if (d && Array.isArray(d.shows)) {
        allData = d.shows;
        generatedAtGlobal = d.generated_at || null;
    } else {
        allData = [];
    }
    dataById = new Map(allData.map(r => [String(r.id), r]));
}).catch(e => {
    console.error('Failed to load data.json:', e);
    dataLoadFailed = true;
    $('statusText').textContent = 'Could not load archive data.';
    $('archiveContainer').innerHTML = '';
    $('noResults').textContent = 'Failed to load data.json.';
    $('noResults').style.display = 'block';
});

Promise.allSettled([readmeReady, dataReady]).then(() => {
    renderStaticPages();
    renderRoute(); // still let Home/Wants/Rules/Contact work even if Videos data failed
});
</script>
</body>
</html>
