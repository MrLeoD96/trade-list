<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Musical Theater Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#171514;--paper:#211e1b;--paper2:#27231f;--paper3:#302a25;--line:#443d37;--text:#eee7dd;--soft:#c9c0b6;--muted:#938a80;--dim:#6f675f;--accent:#d78d76;--accent2:#e5a18a;--accent-soft:rgba(215,141,118,.12);--mono:#a99e92;--mark:#d9b765;--marktext:#211a10;--serif:'Bodoni Moda',Georgia,serif;--sans:'Karla',system-ui,sans-serif;--mono-font:'Space Mono',monospace;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);line-height:1.55;background:linear-gradient(#1b1816,var(--bg) 420px)}
button,input,select{font:inherit}.site-header{padding:48px 20px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#211d1a 0%,#1b1816 100%)}.header-inner,.page{max-width:1080px;margin:auto}
.eyebrow{text-align:center;color:var(--accent);font:700 10px var(--mono-font);letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}.site-title{margin:0;text-align:center;font:600 clamp(34px,6vw,56px)/1.02 var(--serif);letter-spacing:-.035em;color:#f4eee6}.last-updated{text-align:center;color:var(--muted);font:11px var(--mono-font);margin:12px 0 28px}.last-updated .date{color:var(--accent2)}
.search-row{display:flex;max-width:820px;margin:auto;gap:8px}.search-box{position:relative;flex:1}.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.search-box input{width:100%;height:48px;padding:0 48px 0 45px;color:var(--text);background:#151311;border:1px solid #4a423b;border-radius:7px;outline:0}.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.key{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:10px var(--mono-font);color:var(--dim);border:1px solid var(--line);padding:3px 6px;border-radius:4px}.clear{display:none;position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer}.header-tools{max-width:820px;margin:9px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.status{color:var(--muted);font:11px var(--mono-font)}.tools{display:flex;gap:6px;align-items:center}.tool,.sort{height:30px;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:5px;padding:0 9px;font-size:11px;cursor:pointer}.tool:hover,.sort:hover{border-color:#64584e;color:var(--text)}
.page{padding:24px 20px 80px}.preamble-shell{display:none;margin-bottom:25px;border:1px solid var(--line);background:var(--paper);border-radius:7px;overflow:hidden}.preamble-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;background:var(--paper2);border-bottom:1px solid transparent;cursor:pointer}.preamble-shell.open .preamble-head{border-bottom-color:var(--line)}.preamble-label{font:700 10px var(--mono-font);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}.preamble-toggle{color:var(--muted);font:11px var(--mono-font)}.preamble-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}.preamble-shell.open .preamble-body{grid-template-rows:1fr}.preamble-content{min-height:0;overflow:hidden}.preamble-markdown{padding:20px 24px;color:var(--soft);font-size:14px}.preamble-markdown>*:first-child{margin-top:0}.preamble-markdown>*:last-child{margin-bottom:0}.preamble-markdown h1,.preamble-markdown h2,.preamble-markdown h3{font-family:var(--serif);color:var(--text);font-weight:500}.preamble-markdown h2{font-size:24px}.preamble-markdown a{color:var(--accent2)}.preamble-markdown blockquote{border-left:2px solid var(--accent);padding-left:14px;color:var(--muted)}.preamble-markdown code{font-family:var(--mono-font);font-size:.85em;background:#151311;padding:2px 5px;border-radius:3px}
.archive-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.archive-heading{font:500 25px var(--serif);margin:0;color:#f0e8de}.view-controls{display:flex;gap:5px}.view-btn{font:10px var(--mono-font);padding:6px 8px;background:none;color:var(--muted);border:1px solid var(--line);cursor:pointer}.view-btn:first-child{border-radius:4px 0 0 4px}.view-btn:last-child{border-radius:0 4px 4px 0}.view-btn.active{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
.group{margin-bottom:28px}.group-heading{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 7px;border-bottom:1px solid var(--line);margin-bottom:6px}.group-title{margin:0;font:600 20px var(--serif);color:var(--text)}.group-count{font:10px var(--mono-font);color:var(--dim)}
.record{border-bottom:1px solid var(--line);background:transparent}.record details{margin:0}.record summary{display:grid;grid-template-columns:minmax(0,1fr) 145px 100px 110px;align-items:center;gap:16px;padding:13px 8px;list-style:none;cursor:pointer}.record summary::-webkit-details-marker{display:none}.record summary:hover{background:rgba(255,255,255,.025)}.record summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.summary-title{min-width:0}.title-line{font-size:15px;font-weight:700;color:#f1e9df}.lead-line{margin-top:3px;color:var(--accent2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary-master{min-width:0;color:var(--soft);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary-master small{display:block;color:var(--dim);font:9px var(--mono-font);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}.summary-date{font:10px var(--mono-font);color:var(--mono);white-space:nowrap}.summary-size{text-align:right;font:10px var(--mono-font);color:var(--mono);white-space:nowrap}.chevron{width:18px;height:18px;justify-self:end;color:var(--muted);transform:rotate(0);transition:transform .25s var(--ease)}details[open] .chevron{transform:rotate(180deg);color:var(--accent2)}
.record-body{padding:0 8px 17px 8px}.record-body-inner{border-left:2px solid #3e3731;padding:12px 0 0 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 25px}.detail-label{display:block;color:var(--dim);font:700 9px var(--mono-font);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}.detail-value{color:var(--soft);font-size:12px;word-break:break-word}.detail.full{grid-column:1/-1}.request-btn{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:5px 8px;border:1px solid #58443d;border-radius:4px;background:transparent;color:var(--accent2);font:10px var(--mono-font);cursor:pointer}.request-btn:hover{background:var(--accent-soft);border-color:var(--accent)}.request-btn.requested{color:#1e1814;background:var(--accent2);border-color:var(--accent2)}
.highlight{background:var(--mark);color:var(--marktext);padding:1px 2px;border-radius:2px;font-weight:700}.no-results{display:none;text-align:center;padding:70px;color:var(--muted)}.skeleton{height:52px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,#2a2521,transparent);background-size:200% 100%;animation:shine 1.3s linear infinite}@keyframes shine{to{background-position:-200% 0}}
.request-pill{position:fixed;right:22px;bottom:22px;display:none;align-items:center;gap:8px;padding:11px 15px;background:var(--accent);color:#241b18;border:0;border-radius:999px;box-shadow:0 8px 25px #0008;font:700 11px var(--mono-font);cursor:pointer;z-index:90}.request-pill.show{display:flex}.request-count{background:#241b18;color:var(--accent2);border-radius:999px;padding:2px 6px}.back-top{position:fixed;left:22px;bottom:22px;display:none;padding:8px 10px;background:var(--paper2);border:1px solid var(--line);color:var(--muted);font:10px var(--mono-font);cursor:pointer;border-radius:5px}.back-top.show{display:block}
@media(max-width:800px){.record summary{grid-template-columns:minmax(0,1fr) 120px 90px}.summary-date{display:none}.record-body-inner{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.site-header{padding:32px 14px 18px}.page{padding:18px 14px 60px}.search-row{display:block}.search-box{margin-bottom:7px}.header-tools{align-items:flex-start}.tools{flex-wrap:wrap;justify-content:flex-end}.archive-head{display:block}.view-controls{margin-top:8px}.record summary{grid-template-columns:minmax(0,1fr) 30px;gap:8px;padding:12px 3px}.summary-master,.summary-size{display:none}.record-body-inner{grid-template-columns:1fr}.detail.full{grid-column:auto}.group-title{font-size:18px}.back-top{display:none!important}.request-pill{right:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
<div class="eyebrow">Personal Collection · Archive</div><h1 class="site-title" id="siteTitle">Musical Theater Archive</h1><div class="last-updated" id="lastUpdated"></div>
<div class="search-row"><div class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search shows, masters, venues, cast…" aria-label="Search archive"><span class="key">/</span><button class="clear" id="clearSearch" aria-label="Clear search">×</button></div></div>
<div class="header-tools"><div class="status" id="statusText">Loading archive…</div><div class="tools"><select class="sort" id="sortSelect" aria-label="Sort"><option value="date-desc">Newest first</option><option value="date-asc">Oldest first</option><option value="title-asc">Title A–Z</option><option value="master-asc">Master A–Z</option></select><button class="tool" id="expandAll">Expand all</button><button class="tool" id="collapseAll">Collapse all</button></div></div>
</div></header>
<main class="page">
<section class="preamble-shell" id="preambleShell"><div class="preamble-head" id="preambleHead"><span class="preamble-label">About this archive</span><span class="preamble-toggle" id="preambleToggle">Show</span></div><div class="preamble-body"><div class="preamble-content"><div class="preamble-markdown" id="preambleContent"></div></div></div></section>
<div class="archive-head"><h2 class="archive-heading">Recordings</h2><div class="view-controls"><button class="view-btn active" data-view="grouped">Grouped by show</button><button class="view-btn" data-view="flat">Flat list</button></div></div>
<div id="archiveContainer"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div class="no-results" id="noResults">No matching recordings.</div>
</main>
<button class="request-pill" id="requestPill"><span>Request</span><span class="request-count" id="requestCount">0</span></button><button class="back-top" id="backTop">↑ Top</button>
<script>
let allData=[],currentQuery='',sortMode='date-desc',viewMode='grouped',requestedItems=[],searchTimer;
const $=id=>document.getElementById(id);
function esc(v){return v==null||v===''?'-':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function hi(v,q){let s=esc(v);if(!q)return s;let r=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp('('+r+')','gi'),'<span class="highlight">$1</span>')}
function dateValue(v){if(!v)return 0;let p=String(v).split('/');if(p.length!==3)return 0;return new Date(+p[2],+p[1]-1,+p[0]).getTime()||0}
function fmtDate(v,precision,seq){if(!v)return '-';let p=String(v).split('/');if(p.length!==3)return v;let d=new Date(+p[2],+p[1]-1,+p[0]),s=seq?' ('+seq+')':'';if(precision==='day')return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})+s;if(precision==='month')return d.toLocaleDateString('en-US',{year:'numeric',month:'short'})+s;if(precision==='year')return p[2]+s;return v+s}
function leads(cast){if(!cast)return '';return String(cast).split(/\s*[;,|]\s*/).filter(Boolean).slice(0,2).join(' · ')}
function searchable(r){return [r.title,r.venue_production,r.master,r.performance_type,r.format_type,r.quality_resolution,r.file_size_original_text,r.cast,r.notes,r.date].filter(Boolean).join(' ').toLowerCase()}
function sortRows(rows){return [...rows].sort((a,b)=>{if(sortMode==='title-asc')return String(a.title||'').localeCompare(String(b.title||''),undefined,{sensitivity:'base'});if(sortMode==='master-asc')return String(a.master||'').localeCompare(String(b.master||''),undefined,{sensitivity:'base'});let d=dateValue(a.date)-dateValue(b.date);return sortMode==='date-asc'?d:-d})}
function requestKey(r){return [r.title||'',r.date||'',r.master||''].join('|')}
function isRequested(r){return requestedItems.some(x=>x.key===requestKey(r))}
function record(r,index,q){let req=isRequested(r);return `<article class="record" data-index="${index}"><details><summary><div class="summary-title"><div class="title-line">${hi(r.title||'-',q)}</div>${leads(r.cast)?`<div class="lead-line">${hi(leads(r.cast),q)}</div>`:''}</div><div class="summary-master"><small>Master</small>${hi(r.master||'-',q)}</div><div class="summary-date">${hi(fmtDate(r.date,r.date_precision,r.master_sequence_num),q)}</div><div class="summary-size">${hi(r.file_size_original_text||'-',q)}<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div></summary><div class="record-body"><div class="record-body-inner"><div><span class="detail-label">Venue / Production</span><span class="detail-value">${hi(r.venue_production||'-',q)}</span></div><div><span class="detail-label">Performance</span><span class="detail-value">${hi(r.performance_type||'-',q)}</span></div><div><span class="detail-label">Format</span><span class="detail-value">${hi(r.format_type||'-',q)}</span></div><div><span class="detail-label">Resolution</span><span class="detail-value">${hi(r.quality_resolution||'-',q)}</span></div><div><span class="detail-label">Cast</span><span class="detail-value">${hi(r.cast||'-',q)}</span></div><div><span class="detail-label">File size</span><span class="detail-value">${hi(r.file_size_original_text||'-',q)}</span></div><div class="detail full"><span class="detail-label">Notes</span><span class="detail-value">${hi(r.notes||'-',q)}</span></div><div class="detail full"><button class="request-btn ${req?'requested':''}" data-request="${index}">${req?'✓ Requested':'+ Request'}</button></div></div></div></details></article>`}
function render(){currentQuery=currentQuery||'';let q=currentQuery.trim().toLowerCase();let rows=sortRows(allData.filter(r=>!q||searchable(r).includes(q)));let html='';if(viewMode==='grouped'){let groups=new Map();rows.forEach(r=>{let k=String(r.title||'Untitled').trim()||'Untitled';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});for(const [title,rs] of groups){if(rs.length===1){html+=record(rs[0],allData.indexOf(rs[0]),q)}else{html+=`<section class="group"><div class="group-heading"><h3 class="group-title">${hi(title,q)}</h3><span class="group-count">${rs.length} recordings</span></div>${rs.map(r=>record(r,allData.indexOf(r),q)).join('')}</section>`}}}else html=rows.map(r=>record(r,allData.indexOf(r),q)).join('');$('archiveContainer').innerHTML=html;$('noResults').style.display=rows.length?'none':'block';$('statusText').textContent=q?`${rows.length} of ${allData.length} recordings`:`${allData.length} recordings`;}
$('archiveContainer').addEventListener('click',e=>{let b=e.target.closest('[data-request]');if(!b)return;e.preventDefault();e.stopPropagation();let r=allData[+b.dataset.request],key=requestKey(r);let i=requestedItems.findIndex(x=>x.key===key);if(i>=0)requestedItems.splice(i,1);else requestedItems.push({key,title:r.title||'',date:r.date||'',master:r.master||''});updateRequests();b.classList.toggle('requested',i<0);b.textContent=i<0?'+ Request':'✓ Requested';});
function updateRequests(){$('requestCount').textContent=requestedItems.length;$('requestPill').classList.toggle('show',requestedItems.length>0)}
$('requestPill').addEventListener('click',()=>{if(!requestedItems.length)return;let body=requestedItems.map((x,i)=>`${i+1}. ${x.title}${x.date?' — '+x.date:''}${x.master?' — '+x.master:''}`).join('\n');let subject=encodeURIComponent('Archive request');let mail=`mailto:?subject=${subject}&body=${encodeURIComponent(body)}`;window.location.href=mail});
$('searchInput').addEventListener('input',e=>{ $('clearSearch').style.display=e.target.value?'block':'none';clearTimeout(searchTimer);searchTimer=setTimeout(()=>{currentQuery=e.target.value;render()},150)});
$('clearSearch').addEventListener('click',()=>{$('searchInput').value='';$('clearSearch').style.display='none';currentQuery='';render();$('searchInput').focus()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('searchInput').focus()}if(e.key==='Escape'&&document.activeElement===$('searchInput')&&$('searchInput').value){$('searchInput').value='';$('clearSearch').style.display='none';currentQuery='';render()}});
$('sortSelect').addEventListener('change',e=>{sortMode=e.target.value;render()});$('expandAll').addEventListener('click',()=>document.querySelectorAll('#archiveContainer details').forEach(d=>d.open=true));$('collapseAll').addEventListener('click',()=>document.querySelectorAll('#archiveContainer details').forEach(d=>d.open=false));
document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',()=>{viewMode=b.dataset.view;document.querySelectorAll('.view-btn').forEach(x=>x.classList.toggle('active',x===b));render()}));
$('preambleHead').addEventListener('click',()=>{let s=$('preambleShell'),open=s.classList.toggle('open');$('preambleToggle').textContent=open?'Hide':'Show'});
window.addEventListener('scroll',()=>{$('backTop').classList.toggle('show',scrollY>600)},{passive:true});$('backTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
async function fetchLastUpdated(){try{let parts=location.hostname.split('.'),owner=parts[0],repo=location.pathname.split('/')[1];if(!owner||!repo)return;let r=await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1`);if(!r.ok)return;let c=await r.json();if(c.length){let d=new Date(c[0].commit.committer.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});$('lastUpdated').innerHTML=`Last updated <span class="date">${esc(d)}</span>`}}catch(e){console.log('Could not fetch last updated date.',e)}}fetchLastUpdated();
fetch('README.md').then(r=>r.ok?r.text():null).then(text=>{if(!text)return;let html=marked.parse(text),m=html.match(/<h1[^>]*>(.*?)<\/h1>/i);if(m){let t=document.createElement('div');t.innerHTML=m[1];$('siteTitle').textContent=t.textContent;html=html.replace(m[0],'')}$('preambleContent').innerHTML=html;$('preambleShell').style.display='block'}).catch(()=>{});
fetch('data.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{allData=Array.isArray(d)?d:[];render()}).catch(e=>{$('statusText').textContent='Could not load archive data.';$('archiveContainer').innerHTML='';$('noResults').textContent='Failed to load data.json.';$('noResults').style.display='block'});
</script></body></html>
