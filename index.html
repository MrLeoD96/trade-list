<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Theater Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown Preamble -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11; /* Darker background for more contrast */
            --card-bg: #1a1a1e;
            --card-hover: #222227;
            --border-color: #333338;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
            --text-dim: #60606e;
            --accent: #6366f1; /* Vibrant Indigo accent */
            --accent-hover: #818cf8;
            --highlight-bg: #fbbf24; /* Amber for search highlights */
            --highlight-text: #1a1a1e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .header {
            background-color: rgba(15, 15, 17, 0.8);
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        h1#siteTitle {
            margin: 0 0 8px 0;
            color: #ffffff;
            font-weight: 700;
            font-size: 28px;
        }

        #lastUpdated {
            margin: 0 0 20px 0;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
        }

        #lastUpdated .date {
            color: var(--accent-hover);
            font-weight: 600;
        }

        .search-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        #statusText {
            margin-top: 10px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* Preamble Styling */
        #preamble-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        #preamble-container h1, #preamble-container h2, #preamble-container h3 {
            color: var(--accent-hover);
            margin-top: 0;
        }
        #preamble-container h1:first-child {
            display: none; /* Hides the title inside the box since it's used at the top of the page */
        }
        #preamble-container a {
            color: var(--accent-hover);
        }
        #preamble-container ul {
            padding-left: 20px;
        }

        /* Card Styling */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.1s;
        }

        .card:hover {
            border-color: #4a4a52;
        }

        .card-header {
            padding: 20px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info {
            flex: 1;
            padding-right: 16px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 8px 0;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .meta-item {
            display: flex;
            align-items: center;
        }

        .meta-icon {
            margin-right: 6px;
            opacity: 0.6;
        }

        .card-body {
            display: none;
            padding: 0 24px 24px;
            border-top: 1px solid var(--border-color);
            margin-top: -1px;
        }

        .card.expanded .card-body {
            display: block;
            animation: slideDown 0.2s ease-in;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expand-icon {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            font-size: 14px;
        }

        .card.expanded .expand-icon {
            transform: rotate(180deg);
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding-top: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .detail-value {
            color: var(--text-main);
            font-size: 14px;
            word-break: break-word;
        }

        .full-width {
            grid-column: 1 / -1;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        /* Search Highlighting */
        .highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 18px;
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .card-header {
                padding: 16px;
            }
            .card-body {
                padding: 0 16px 16px;
            }
            .card-title {
                font-size: 18px;
            }
            #preamble-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="siteTitle">Musical Theater Archive</h1>
        <div id="lastUpdated"></div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search shows, masters, venues, cast members...">
            <div id="statusText">Loading data...</div>
        </div>
    </div>

    <div class="container">
        <!-- Preamble will be injected here -->
        <div id="preamble-container" style="display: none;"></div>
        
        <div id="archiveContainer"></div>
        <div id="noResults" class="no-results" style="display: none;">No matching records found.</div>
    </div>

    <script>
        let allData = [];
        let currentQuery = '';

        // --- Helper Functions ---

        function escapeHtml(text) {
            if (!text) return "-";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function highlightText(text, query) {
            let safeText = escapeHtml(text);
            if (!query) return safeText;
            
            let safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let regex = new RegExp(`(${safeQuery})`, 'gi');
            return safeText.replace(regex, '<span class="highlight">$1</span>');
        }

        function formatDate(dateStr, precision, seqNum) {
            if (!dateStr) return "-";
            let parts = dateStr.split('/');
            if (parts.length !== 3) return dateStr;

            let dt = new Date(parts[2], parts[1] - 1, parts[0]);
            let seq = seqNum ? ` (${seqNum})` : "";
            
            if (precision === 'day') return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + seq;
            if (precision === 'month') return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long' }) + seq;
            if (precision === 'year') return parts[2] + seq;
            return dateStr + seq;
        }

        // --- Rendering ---

        function renderCards(query) {
            currentQuery = query;
            let visibleCount = 0;
            let html = '';

            allData.forEach(row => {
                let searchPool = [
                    row.title, row.venue_production, row.master, 
                    row.performance_type, row.format_type, row.quality_resolution, 
                    row.cast, row.notes
                ].filter(Boolean).join(' ').toLowerCase();

                if (query && !searchPool.toLowerCase().includes(query.toLowerCase())) {
                    return;
                }
                visibleCount++;

                let formattedDate = formatDate(row.date, row.date_precision, row.master_sequence_num);

                html += `
                <div class="card" onclick="toggleCard(this)">
                    <div class="card-header">
                        <div class="card-info">
                            <div class="card-title">${highlightText(row.title || "-", query)}</div>
                            <div class="card-meta">
                                <span class="meta-item">📅 ${highlightText(formattedDate, query)}</span>
                                <span class="meta-item">🎭 ${highlightText(row.venue_production || "-", query)}</span>
                                <span class="meta-item">🎤 ${highlightText(row.master || "-", query)}</span>
                                <span class="meta-item">🎬 ${highlightText(row.performance_type || "-", query)}</span>
                            </div>
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="card-body" onclick="event.stopPropagation()">
                        <div class="details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Format</span>
                                <span class="detail-value">${highlightText(row.format_type || "-", query)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Resolution</span>
                                <span class="detail-value">${highlightText(row.quality_resolution || "-", query)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">File Size</span>
                                <span class="detail-value">${highlightText(row.file_size_original_text || "-", query)}</span>
                            </div>
                            <div class="detail-item full-width">
                                <span class="detail-label">Cast</span>
                                <span class="detail-value">${highlightText(row.cast || "-", query)}</span>
                            </div>
                            <div class="detail-item full-width">
                                <span class="detail-label">Notes</span>
                                <span class="detail-value">${highlightText(row.notes || "-", query)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('archiveContainer').innerHTML = html;
            
            let statusEl = document.getElementById('statusText');
            if (query) {
                statusEl.innerText = `Showing ${visibleCount} matching record(s).`;
            } else {
                statusEl.innerText = `Showing ${visibleCount} total records.`;
            }

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function toggleCard(cardEl) {
            cardEl.classList.toggle('expanded');
        }

        // --- Initialization ---

        document.getElementById('searchInput').addEventListener('input', function(e) {
            renderCards(e.target.value);
        });

        // 1. Fetch the Last Updated Date from GitHub API
        async function fetchLastUpdated() {
            try {
                // Extracts username and repo name from the URL (e.g., username.github.io/repo)
                const hostParts = window.location.hostname.split('.');
                const owner = hostParts[0];
                const repo = window.location.pathname.split('/')[1];
                
                if (!owner || !repo) return; // Failsafe for local testing

                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1`;
                const response = await fetch(apiUrl);
                if (!response.ok) return;
                
                const commits = await response.json();
                if (commits.length > 0) {
                    const dateStr = commits[0].commit.committer.date;
                    const formattedDate = new Date(dateStr).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    document.getElementById('lastUpdated').innerHTML = `Last updated: <span class="date">${formattedDate}</span>`;
                }
            } catch (e) {
                console.log("Could not fetch last updated date.", e);
            }
        }
        fetchLastUpdated();

        // 2. Load the Preamble (README.md)
        fetch('README.md')
            .then(response => {
                if (!response.ok) return null;
                return response.text();
            })
            .then(text => {
                if (text) {
                    // Parse markdown to HTML
                    let htmlContent = marked.parse(text);
                    
                    // Extract the first H1 title to use as the site title
                    let titleMatch = htmlContent.match(/<h1[^>]*>(.*?)<\/h1>/i);
                    if (titleMatch && titleMatch[1]) {
                        document.getElementById('siteTitle').innerText = titleMatch[1];
                        // Remove that first H1 from the preamble box so it doesn't show twice
                        htmlContent = htmlContent.replace(titleMatch[0], '');
                    }
                    
                    document.getElementById('preamble-container').innerHTML = htmlContent;
                    document.getElementById('preamble-container').style.display = 'block';
                }
            })
            .catch(() => {
                console.log("No README.md found. Skipping preamble.");
            });

        // 3. Load the Archive Data
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                allData = data;
                renderCards('');
            })
            .catch(error => {
                console.error('Error loading data.json:', error);
                document.getElementById('statusText').innerText = "Error loading data. Make sure data.json exists.";
                document.getElementById('noResults').innerText = "Failed to load data.";
                document.getElementById('noResults').style.display = 'block';
            });
    </script>
</body>
</html>
